---
# Installs the Mac's scheduled jobs as launchd LaunchAgents (they run as you, with your PATH tools,
# ssh keys, kubeconfig, gh/Claude logins and iCloud Drive). Re-run after changing a schedule.
#   ansible-playbook mac-playbooks/scheduled-jobs/scheduled-jobs.yml
# Logs: ~/Library/Logs/homelab/. Run one now: launchctl kickstart gui/$(id -u)/<label>
# Remove one: launchctl bootout gui/$(id -u)/<label> && rm ~/Library/LaunchAgents/<label>.plist
- name: Install Mac scheduled jobs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    home: "{{ lookup('env', 'HOME') }}"
    scripts_dir: "{{ home }}/source/repos/ansible-setup/mac-playbooks/scheduled-jobs/scripts"
    log_dir: "{{ home }}/Library/Logs/homelab"
    launch_agents_dir: "{{ home }}/Library/LaunchAgents"
    # Times are the Mac's local time (America/Chicago).
    jobs:
      # Copies the backup Pi's nhl-odds dumps and Grafana DBs into iCloud after its 4:00 pull off the
      # cluster, then backs up the Mac itself
      - name: nightly-backup
        label: com.coletitze.nightly-backup
        script: nightly-backup.sh
        hour: 4
        minute: 30
      # Warns if a backup didn't reach iCloud overnight, nightly-backup included
      - name: backup-stale-check
        label: com.coletitze.backup-stale-check
        script: backup-stale-check.sh
        hour: 9
        minute: 0
      # Saturday, after the nightly backup (4:30): restores the newest iCloud copies to prove they work
      - name: restore-drill
        label: com.coletitze.restore-drill
        script: restore-drill.sh
        weekday: 6
        hour: 5
        minute: 30
      # alert-agent and weekly-upgrade moved to the backup Pi (utilities/backup-node-alert-agent.yml,
      # backup-node-weekly-upgrade.yml). Removing a job here doesn't unload it:
      # launchctl bootout gui/$(id -u)/<label> and rm its plist.
      # At login: start Ollama (nhl-odds assistant) and a Terminal running `claude rc`
      - name: login-apps
        label: com.coletitze.login-apps
        script: login-apps.sh
        run_at_load: true
        process_type: Standard

  # alerting_vars.yml: alerting_discord_webhook_url, the channel the jobs report to
  vars_files:
    - "{{ lookup('env', 'ANSIBLE_FILES_PATH') or home + '/source/ansible-files' }}/vars/alerting_vars.yml"

  tasks:
    # launchd's bash can't read the vaulted file in iCloud; the jobs read the keychain copy
    # (common.sh discord_post)
    - name: Copy the Discord webhook to the login keychain
      ansible.builtin.command:
        argv: [security, add-generic-password, -U, -s, homelab-discord-webhook, -a, homelab,
               -w, "{{ alerting_discord_webhook_url }}"]
      changed_when: false
      no_log: true

    - name: Ensure log and LaunchAgents directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ log_dir }}"
        - "{{ launch_agents_dir }}"

    - name: Make the job scripts executable
      ansible.builtin.file:
        path: "{{ scripts_dir }}/{{ item.script }}"
        mode: "0755"
      loop: "{{ jobs }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Write the LaunchAgent plists
      ansible.builtin.template:
        src: templates/launch-agent.plist.j2
        dest: "{{ launch_agents_dir }}/{{ item.label }}.plist"
        mode: "0644"
      loop: "{{ jobs }}"
      loop_control:
        label: "{{ item.label }}"
      register: plists

    - name: Get your user id for launchctl
      ansible.builtin.command: id -u
      register: uid
      changed_when: false

    # bootout fails if the job isn't loaded yet; that's fine
    - name: Unload changed LaunchAgents
      ansible.builtin.command: "launchctl bootout gui/{{ uid.stdout }}/{{ item.item.label }}"
      loop: "{{ plists.results }}"
      loop_control:
        label: "{{ item.item.label }}"
      when: item.changed
      failed_when: false
      changed_when: true

    - name: Load LaunchAgents that aren't loaded
      ansible.builtin.shell: |
        launchctl print gui/{{ uid.stdout }}/{{ item.label }} >/dev/null 2>&1 && exit 0
        launchctl bootstrap gui/{{ uid.stdout }} {{ launch_agents_dir }}/{{ item.label }}.plist && echo loaded
      loop: "{{ jobs }}"
      loop_control:
        label: "{{ item.label }}"
      register: loaded
      changed_when: "'loaded' in loaded.stdout"
