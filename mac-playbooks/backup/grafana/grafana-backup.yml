---
# grafana-db-backup CronJob (kubernetes/prometheus/prometheus.yml) writes to whichever worker
# runs Grafana, so pull from every worker that has the folder. Restore: scale Grafana to 0, copy a
# grafana-*.db into the cluster-monitoring-grafana volume as grafana.db (owned 472:472), scale back to 1.
- name: Backup Grafana database
  hosts: nodes
  gather_facts: false

  vars:
    local_backup_dir: "{{ lookup('env', 'HOME') }}/source/ansible-files/backups/grafana/"
    remote_backup_dir: /home/pi/backups/grafana/
    local_keep: 35

  tasks:
    - name: Ensure local backup directory exists
      ansible.builtin.file:
        path: "{{ local_backup_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    # A worker that has never run the CronJob has no folder; skip it instead of warning
    - name: Check for the backup folder on node
      ansible.builtin.stat:
        path: "{{ remote_backup_dir }}"
      register: backup_dir

    - name: Get list of backup files on node
      when: backup_dir.stat.isdir | default(false)
      ansible.builtin.find:
        paths: "{{ remote_backup_dir }}"
        patterns: "grafana-*.db"
        file_type: file
      register: backup_files

    - name: Fetch backup files to local machine
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ local_backup_dir }}"
        flat: true
      loop: "{{ backup_files.files | default([]) }}"

    - name: Find local Grafana backups
      ansible.builtin.find:
        paths: "{{ local_backup_dir }}"
        patterns: "grafana-*.db"
        file_type: file
      register: local_backups
      delegate_to: localhost
      run_once: true

    # Names are dated, so newest first by name. Keep more than the node's 30 days so a deleted
    # file is never one the next run would fetch again.
    - name: Remove all but the newest local Grafana backups
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (local_backups.files | sort(attribute='path', reverse=true))[local_keep:] }}"
      loop_control:
        label: "{{ item.path | basename }}"
      delegate_to: localhost
      run_once: true
