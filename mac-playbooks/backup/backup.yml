- name: Backup macbook.
  import_playbook: macbook/macbook-backup.yml
  tags: ['macbook']

- name: Backup NHL Odds database.
  import_playbook: nhl-odds/nhl-odds-backup.yml
  tags: ['nhl-odds']

- name: Backup Grafana database.
  import_playbook: grafana/grafana-backup.yml
  tags: ['grafana']

# Only reached when the nhl-odds and Grafana copies succeeded (a failed play stops the run)
- name: Mark the iCloud copy done on the backup Pi.
  import_playbook: offsite/mark-copied.yml
  tags: ['nhl-odds', 'grafana']

