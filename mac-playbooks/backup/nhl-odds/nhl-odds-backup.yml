---
# Copies the backup Pi's nhl-odds dumps (pulled off the cluster at 4:00, backup-node-db-pull.yml)
# into iCloud. Dumps are ~2.4 GB and growing; downloading straight into iCloud Drive made iCloud
# upload while the transfer ran, choking it to ~1.5 MB/s. So: rsync only new dumps into a non-iCloud
# staging dir, then copy them into iCloud after, and check each new iCloud copy against the Pi's
# SHA256SUMS. The Mac's offsite key can only read the Pi's backups dir (backup-node-jobs.yml).
- name: Backup NHL Odds database
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    backup_pi: pi@10.42.0.3
    offsite_key: "{{ lookup('env', 'HOME') }}/.ssh/backuppi_offsite"
    staging_backup_dir: "{{ lookup('env', 'HOME') }}/source/backups/nhl-odds/"
    icloud_backup_dir: "{{ lookup('env', 'HOME') }}/source/ansible-files/backups/nhl-odds/"
    staging_keep: 15
    # iCloud keeps the newest 7 dumps plus the newest dump of each of the 4 weeks before them,
    # so about a month of history in 11 files (~2.4 GB each)
    icloud_daily_keep: 7
    icloud_weekly_keep: 4
    # Only nightly dumps; older hand-named files (nhl-20260415.dump, *-pre-repair) sort wrong and are left alone
    dump_pattern: "nhl-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].dump"
    dump_regex: '^nhl-\d{4}-\d{2}-\d{2}\.dump$'
    # /usr/bin/rsync and ssh: under launchd, macOS Local Network privacy only lets Apple's binaries
    # reach 10.42.0.x
    rsync_ssh: "ssh -i {{ offsite_key }} -o BatchMode=yes -o ConnectTimeout=10"

  tasks:
    - name: Ensure local backup directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ staging_backup_dir }}"
        - "{{ icloud_backup_dir }}"

    # Lists every finished dump on the Pi (partial transfers there never get a line)
    - name: Get the Pi's SHA256SUMS
      ansible.builtin.command:
        argv: [/usr/bin/rsync, -t, -e, "{{ rsync_ssh }}", "{{ backup_pi }}:nhl-odds/SHA256SUMS", "{{ staging_backup_dir }}"]
      changed_when: false

    - name: Read the Pi's checksums
      ansible.builtin.set_fact:
        pi_sums: >-
          {{ dict(lookup('file', staging_backup_dir + 'SHA256SUMS').splitlines()
                  | map('split') | map('reverse')
                  | selectattr('0', 'match', dump_regex) | list) }}

    - name: Find staged backups
      ansible.builtin.find:
        paths: "{{ staging_backup_dir }}"
        patterns: "{{ dump_pattern }}"
        file_type: file
      register: staged_backups

    # Only the newest dumps go to iCloud as dailies; older ones are already there or not needed.
    # --partial-dir keeps an interrupted transfer out of the final name, so a staged name is whole.
    - name: Pull new dumps from the backup Pi to staging
      ansible.builtin.command:
        argv: [/usr/bin/rsync, -t, --partial-dir=.rsync-partial, -e, "{{ rsync_ssh }}",
               "{{ backup_pi }}:nhl-odds/{{ item }}", "{{ staging_backup_dir }}"]
      loop: "{{ (pi_sums.keys() | sort(reverse=true))[:icloud_daily_keep]
                | difference(staged_backups.files | map(attribute='path') | map('basename')) | sort }}"
      register: pulled

    - name: Check the pulled dumps against the Pi's checksums
      ansible.builtin.shell: |
        set -o pipefail
        cd "{{ staging_backup_dir }}" && grep -E '  ({{ pulled.results | map(attribute='item') | map('regex_escape') | join('|') }})$' SHA256SUMS | shasum -a 256 -c
      when: pulled.results | length > 0
      changed_when: false

    - name: Find staged backups
      ansible.builtin.find:
        paths: "{{ staging_backup_dir }}"
        patterns: "{{ dump_pattern }}"
        file_type: file
      register: staged_backups

    - name: Remove all but the newest staged backups (names are dated)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (staged_backups.files | sort(attribute='path', reverse=true))[staging_keep:] }}"
      loop_control:
        label: "{{ item.path | basename }}"

    # force: false skips dumps already in iCloud without checksumming them
    - name: Copy the newest backups into iCloud
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ icloud_backup_dir }}"
        force: false
        mode: "0644"
      loop: "{{ (staged_backups.files | sort(attribute='path', reverse=true))[:icloud_daily_keep] }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: icloud_copies

    - name: Checksum the new iCloud copies
      ansible.builtin.stat:
        path: "{{ icloud_backup_dir }}{{ item.item.path | basename }}"
        checksum_algorithm: sha256
      loop: "{{ icloud_copies.results | selectattr('changed') | list }}"
      loop_control:
        label: "{{ item.item.path | basename }}"
      register: icloud_sums

    - name: Fail if an iCloud copy doesn't match the Pi
      ansible.builtin.fail:
        msg: "CHECKSUM MISMATCH: {{ bad | join(', ') }}"
      vars:
        # A dump staged before the Pi's SHA256SUMS listed it has nothing to compare against
        bad: >-
          {%- set ns = namespace(out=[]) -%}
          {%- for r in icloud_sums.results -%}
            {%- set name = r.item.item.path | basename -%}
            {%- if name in pi_sums and r.stat.checksum | default('') != pi_sums[name] -%}
              {%- set ns.out = ns.out + [name] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.out }}
      when: bad | length > 0

    - name: Find iCloud backups
      ansible.builtin.find:
        paths: "{{ icloud_backup_dir }}"
        patterns: "{{ dump_pattern }}"
        file_type: file
      register: icloud_backups

    # Names are dated, so newest first by name. Past the daily ones, keep the first (newest) dump
    # seen for each ISO week until icloud_weekly_keep weeks are kept.
    - name: Pick the iCloud backups to keep
      ansible.builtin.set_fact:
        icloud_kept: >-
          {%- set ns = namespace(weeks=[], keep=[]) -%}
          {%- for f in icloud_backups.files | sort(attribute='path', reverse=true) -%}
            {%- set week = (f.path | basename)[4:14] | to_datetime('%Y-%m-%d') -%}
            {%- set week = week.strftime('%G-%V') -%}
            {%- if loop.index <= icloud_daily_keep -%}
              {%- set ns.keep = ns.keep + [f.path] -%}
            {%- elif week not in ns.weeks and ns.weeks | length < icloud_weekly_keep -%}
              {%- set ns.weeks = ns.weeks + [week] -%}
              {%- set ns.keep = ns.keep + [f.path] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.keep }}

    - name: Remove the other iCloud backups
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ icloud_backups.files | rejectattr('path', 'in', icloud_kept) | list }}"
      loop_control:
        label: "{{ item.path | basename }}"
