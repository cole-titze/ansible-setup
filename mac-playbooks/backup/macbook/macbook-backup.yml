---
- name: Configure macbook backup
  hosts: localhost
  gather_facts: true
  vars:
    src_map:
      - src: "{{ lookup('env', 'HOME') }}/.ssh"
        dest: "ssh"
      - src: "{{ lookup('env', 'HOME') }}/.kube"
        dest: "kube"
      # Claude Code memories and settings only; skills live in the claude-skills repo
      - src: "{{ lookup('env', 'HOME') }}/.claude"
        dest: "claude"
        filters:
          - "--prune-empty-dirs"
          - "--include=settings.json"
          - "--include=CLAUDE.md"
          - "--include=keybindings.json"
          - "--include=projects/"
          - "--include=projects/*/"
          - "--include=projects/*/memory/***"
          - "--exclude=*"

    icloud_base_dir: "{{ lookup('env', 'HOME') }}/Library/Mobile Documents/com~apple~CloudDocs/ansible-files/backups/macbook"

  tasks:
    # set_fact evaluates the pipe lookup once and stores the result; a plain `vars:` entry
    # re-evaluates lookup('pipe', ...) on every reference, which previously produced two
    # different timestamps (and two backup directories) a second apart within one run.
    - name: Pin the backup timestamp for this run
      ansible.builtin.set_fact:
        icloud_backup_dir: "{{ icloud_base_dir }}/backup_{{ lookup('pipe', 'date +%Y-%m-%d_%H-%M-%S') }}"

    - name: Ensure iCloud backup directory exists
      ansible.builtin.file:
        path: "{{ icloud_backup_dir }}"
        state: directory
        mode: "0755"

    - name: Sync macOS folders to iCloud backup with renamed dirs
      ansible.posix.synchronize:
        src: "{{ item.src }}/"
        dest: "{{ icloud_backup_dir }}/{{ item.dest }}/"
        archive: true
        recursive: true
        rsync_opts: "{{ common_rsync_opts + (item.filters | default([])) }}"
      vars:
        common_rsync_opts:
          - "--no-specials"
          - "--no-devices"
          - "--exclude=*.sock"
          - "--exclude=ssh-*"
          - "--exclude=agent.*"
      loop: "{{ src_map }}"

    - name: Print backup location
      ansible.builtin.debug:
        msg: "Backup completed! File saved as: {{ icloud_backup_dir }}"

    - name: Find all backup directories
      ansible.builtin.find:
        paths: "{{ icloud_base_dir }}"
        patterns: "backup_*"
        file_type: directory
      register: found_backups

    - name: Sort backups by modification time (newest first)
      ansible.builtin.set_fact:
        sorted_backups: "{{ found_backups.files | sort(attribute='mtime', reverse=true) }}"

    - name: Filter backups older than 30 days, excluding the most recent
      ansible.builtin.set_fact:
        deletable_backups: >-
          {{
            sorted_backups[1:]
            | selectattr('mtime', 'lt', (ansible_facts['date_time']['epoch'] | int) - 2592000)
            | list
          }}

    - name: Remove old backup directories (but always keep most recent)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ deletable_backups }}"
      when: deletable_backups | length > 0