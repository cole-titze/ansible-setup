---
# Central logging: Loki (single binary, filesystem chunks on Longhorn, 14-day retention) and
# Grafana Alloy (DaemonSet) shipping every pod's log plus each node's systemd journal.
# Query in Grafana -> Explore -> Loki, e.g. {namespace="nhl-odds", container="webapi"}.
- name: Configure Loki + Alloy logging.
  hosts: control_plane
  gather_facts: false
  become: true

  environment:
    K8S_AUTH_KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    PATH: "/home/{{ ansible_user }}/go/bin:{{ ansible_facts['env']['PATH'] }}"

  tasks:
    - name: Add grafana chart repo.
      kubernetes.core.helm_repository:
        name: grafana
        repo_url: "https://grafana.github.io/helm-charts"

    - name: Deploy Loki
      kubernetes.core.helm:
        name: loki
        chart_ref: grafana/loki
        chart_version: "7.5.0"
        release_namespace: logging
        create_namespace: true
        update_repo_cache: true
        wait: true
        values:
          deploymentMode: SingleBinary
          loki:
            # The chart's default tag lags the Loki patch releases (chart 7.5.0 still ships 3.6.11)
            image:
              tag: 3.6.19
            # One tenant; nothing outside the cluster can reach it
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            storage:
              type: filesystem
            schemaConfig:
              configs:
                - from: "2026-10-01"
                  store: tsdb
                  object_store: filesystem
                  schema: v13
                  index:
                    prefix: index_
                    period: 24h
            limits_config:
              retention_period: 336h
            # The compactor is what actually deletes chunks past retention_period
            compactor:
              retention_enabled: true
              delete_request_store: filesystem
          singleBinary:
            replicas: 1
            persistence:
              enabled: true
              storageClass: longhorn
              size: 20Gi
              # The chart default (true) deletes the PVC, and with it every log, when the
              # StatefulSet is scaled to 0.
              enableStatefulSetAutoDeletePVC: false
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
          # The scalable targets, caches (memcached), gateway and canary are for multi-node Loki
          read:
            replicas: 0
          write:
            replicas: 0
          backend:
            replicas: 0
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
          gateway:
            enabled: false
          lokiCanary:
            enabled: false
          test:
            enabled: false
          # Loads alert-rule ConfigMaps for the Loki ruler; there are none, so it would only be an idle image
          sidecar:
            rules:
              enabled: false

    - name: Deploy Alloy
      kubernetes.core.helm:
        name: alloy
        chart_ref: grafana/alloy
        chart_version: "1.14.3"
        release_namespace: logging
        wait: true
        values:
          alloy:
            # Positions on the host, so a restart resumes where it left off instead of re-sending
            storagePath: /var/lib/alloy
            mounts:
              varlog: true
              extra:
                - name: alloy-data
                  mountPath: /var/lib/alloy
                - name: journal
                  mountPath: /run/log/journal
                  readOnly: true
            extraEnv:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            configMap:
              content: |
                // Pods on this node -> /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
                discovery.kubernetes "pods" {
                  role = "pod"
                  selectors {
                    role  = "pod"
                    field = "spec.nodeName=" + sys.env("NODE_NAME")
                  }
                }

                discovery.relabel "pods" {
                  targets = discovery.kubernetes.pods.targets
                  rule {
                    source_labels = ["__meta_kubernetes_namespace"]
                    target_label  = "namespace"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_name"]
                    target_label  = "pod"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_container_name"]
                    target_label  = "container"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_node_name"]
                    target_label  = "node"
                  }
                  // app.kubernetes.io/name, else the app label
                  rule {
                    source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
                    separator     = ";"
                    regex         = ";*([^;]+).*"
                    target_label  = "app"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                    separator     = "/"
                    target_label  = "__path__"
                    replacement   = "/var/log/pods/*$1/*.log"
                  }
                }

                local.file_match "pods" {
                  path_targets = discovery.relabel.pods.output
                }

                loki.source.file "pods" {
                  targets    = local.file_match.pods.targets
                  forward_to = [loki.process.pods.receiver]
                }

                // containerd's CRI format: "<time> <stream> <F|P> <line>"
                loki.process "pods" {
                  stage.cri {}
                  forward_to = [loki.write.default.receiver]
                }

                // Node services (k3s, kured's reboots, apt, sshd, ...); the journal lives in RAM
                loki.relabel "journal" {
                  forward_to = []
                  rule {
                    source_labels = ["__journal__systemd_unit"]
                    target_label  = "unit"
                  }
                  rule {
                    source_labels = ["__journal_priority_keyword"]
                    target_label  = "level"
                  }
                }

                loki.source.journal "node" {
                  path          = "/run/log/journal"
                  max_age       = "12h"
                  relabel_rules = loki.relabel.journal.rules
                  labels        = {job = "journal", node = sys.env("NODE_NAME")}
                  forward_to    = [loki.write.default.receiver]
                }

                loki.write "default" {
                  endpoint {
                    url = "http://loki.logging.svc:3100/loki/api/v1/push"
                  }
                }
          controller:
            type: daemonset
            # node01 carries a NoExecute control-plane taint
            tolerations:
              - operator: Exists
            volumes:
              extra:
                - name: alloy-data
                  hostPath:
                    path: /var/lib/alloy
                    type: DirectoryOrCreate
                # The Pis' journal is volatile (in RAM, gone on reboot); Loki is now its only history
                - name: journal
                  hostPath:
                    path: /run/log/journal
                    type: Directory

    # The Grafana sidecar loads any ConfigMap labeled grafana_datasource=1
    - name: Add Loki to Grafana
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-datasource-loki
            namespace: default
            labels:
              grafana_datasource: "1"
          data:
            loki.yaml: |
              apiVersion: 1
              datasources:
                - name: Loki
                  uid: loki
                  type: loki
                  access: proxy
                  url: http://loki.logging.svc:3100
                  jsonData:
                    maxLines: 5000
