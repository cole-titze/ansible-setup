---
# Login for the traefik.kubecluster dashboard (user + password from cluster_vars.yml)
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-auth
  namespace: traefik
type: kubernetes.io/basic-auth
stringData:
  username: "{{ dashboard_username }}"
  password: "{{ dashboard_password }}"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-auth
  namespace: traefik
spec:
  basicAuth:
    secret: dashboard-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.kubecluster`)
      kind: Rule
      middlewares:
        - name: dashboard-auth
      services:
        - name: api@internal
          kind: TraefikService
  tls:
    secretName: local-cert
