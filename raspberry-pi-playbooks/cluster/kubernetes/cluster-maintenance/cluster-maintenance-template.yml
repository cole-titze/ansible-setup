---
apiVersion: v1
kind: Namespace
metadata:
  name: cluster-maintenance
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nightly-updater
  namespace: cluster-maintenance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nightly-updater
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nightly-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nightly-updater
subjects:
  - kind: ServiceAccount
    name: nightly-updater
    namespace: cluster-maintenance
---
# The pins themselves (ConfigMap image-pins) are written by the app playbooks and this
# updater, never by this template, so re-applying it can't reset them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nightly-updater-pins
  namespace: cluster-maintenance
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["image-pins"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nightly-updater-pins
  namespace: cluster-maintenance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nightly-updater-pins
subjects:
  - kind: ServiceAccount
    name: nightly-updater
    namespace: cluster-maintenance
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nightly-updater-script
  namespace: cluster-maintenance
data:
  update.sh: |
{% raw %}
    # image-pins maps a name to repo@digest. Each night every name without a
    # <name>.hold key moves to the digest PROMOTE_TAG points at (old one kept in
    # <name>.previous), then every Deployment/CronJob using that repo is set to it.
    # Pinned Deployments only roll when their digest changes. APPLY_ONLY=1 skips the
    # move and just applies the pins (utilities/scripts/image-pin.sh runs it that way).
    # Afterwards each namespace whose pins moved must finish its rollouts and pass a smoke
    # test, or those pins go back to <name>.previous and are held there.
    set -u
    TAG="${PROMOTE_TAG:-latest}"
    ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json"
    status=0
    namespaces="default magic-mirror nhl-odds retirement-calculator"
    moved=""

    digest() {
      tok=$(curl -fsS "https://ghcr.io/token?scope=repository:$1:pull" | jq -r .token) || return 1
      curl -fsSI -H "Authorization: Bearer $tok" -H "Accept: $ACCEPT" "https://ghcr.io/v2/$1/manifests/$TAG" \
        | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }'
    }

    pins=$(kubectl get configmap -n cluster-maintenance image-pins -o json | jq -c '.data // {}') || exit 1
    [ -n "${APPLY_ONLY:-}" ] || for key in $(printf %s "$pins" | jq -r 'keys[] | select(contains(".") | not)'); do
      cur=$(printf %s "$pins" | jq -r --arg k "$key" '.[$k]')
      repo="${cur%@*}"
      if [ -n "$(printf %s "$pins" | jq -r --arg k "$key.hold" '.[$k] // empty')" ]; then
        echo "$key: held at $cur"; continue
      fi
      d=$(digest "${repo#ghcr.io/}")
      case "$d" in
        sha256:*) ;;
        *) echo "$key: lookup of :$TAG failed, keeping $cur"; status=1; continue ;;
      esac
      [ "$repo@$d" = "$cur" ] && { echo "$key: unchanged"; continue; }
      kubectl patch configmap -n cluster-maintenance image-pins --type merge \
        -p "$(jq -nc --arg k "$key" --arg v "$repo@$d" --arg p "$cur" '{data: {($k): $v, ($k + ".previous"): $p}}')" || status=1
      echo "$key: $cur -> $repo@$d"
      moved="$moved $key"
    done

    pins=$(kubectl get configmap -n cluster-maintenance image-pins -o json | jq -c '.data // {}') || exit 1
    for ns in $namespaces; do
      objs=$(kubectl get deployment,cronjob -n "$ns" -o json) || { status=1; continue; }
      # "<kind>/<name> <container>=<image>" for every pinned container that's off its pin
      printf %s "$objs" | jq -r --argjson pins "$pins" '
        ($pins | to_entries | map(select(.key | contains(".") | not)) | map({key: (.value | split("@")[0]), value: .value}) | from_entries) as $want
        | .items[] | (.kind | ascii_downcase) as $k | .metadata.name as $n
        | (.spec.template.spec.containers // .spec.jobTemplate.spec.template.spec.containers)[]
        | (.image | split("@")[0] | sub(":[^:/]+$"; "")) as $repo
        | select($want[$repo] != null and $want[$repo] != .image)
        | "\($k)/\($n) \(.name)=\($want[$repo])"' |
      while read -r obj img; do
        echo "$ns: $obj -> ${img#*=}"
        kubectl set image -n "$ns" "$obj" "$img" || status=1
      done
      # Deployments with no pinned container (cloudflared, ...) still float on :latest
      [ -n "${APPLY_ONLY:-}" ] || for d in $(printf %s "$objs" | jq -r --argjson pins "$pins" '
        ([$pins | to_entries[] | select(.key | contains(".") | not) | .value | split("@")[0]]) as $repos
        | .items[] | select(.kind == "Deployment")
        | select([.spec.template.spec.containers[].image | split("@")[0] | sub(":[^:/]+$"; "")] | any(. as $r | $repos | index($r)) | not)
        | .metadata.name'); do
        kubectl rollout restart deployment -n "$ns" "$d" || status=1
      done
    done

    # Same checks as the CI smoke test (nhl-odds .github/scripts/smoke-test.sh), against the
    # live Services and real data
    get() { curl -fsS --max-time 20 "$1"; }
    smoke() {
      case $1 in
        nhl-odds)
          api=http://nhl-odds-webapi.nhl-odds:8080/api web=http://nhl-odds-frontend.nhl-odds
          get "$api/Team/GetAllTeams?seasonStartYear=$season" | jq -e '.teams | length >= 32' >/dev/null &&
            get "$api/GameOdds/GetAnchorDate?seasonStartYear=$season" | jq -e .anchorDate >/dev/null &&
            get "$api/GameOdds/GetGameOddsInDateRange?startDate=$(date +%F)&endDate=$(date +%F)&seasonStartYear=$season" |
              jq -e 'type == "array"' >/dev/null &&
            for p in /healthz / /teams "/api/Team/GetAllTeams?seasonStartYear=$season"; do
              get "$web$p" >/dev/null || return 1
            done ;;
        retirement-calculator) get http://retirement-calculator.retirement-calculator/ >/dev/null ;;
      esac
    }
    # Rollouts done, then up to 6 tries 10 s apart so a pod still warming up isn't a failure
    healthy() {
      for d in $(kubectl get deployment -n "$1" -o name); do
        kubectl rollout status -n "$1" "$d" --timeout=10m || return 1
      done
      for i in 1 2 3 4 5 6; do
        smoke "$1" && return 0
        sleep 10
      done
      return 1
    }

    [ -n "${APPLY_ONLY:-}" ] || [ -z "$moved" ] || {
      m=$(date +%m); season=$(date +%Y); [ "${m#0}" -ge 9 ] || season=$((season - 1))
      for ns in $namespaces; do
        keys=$(for k in $moved; do case $k in ("$ns" | "$ns"-*) echo "$k" ;; esac; done)
        [ -n "$keys" ] || continue
        if healthy "$ns"; then echo "$ns: smoke test passed"; continue; fi
        echo "$ns: smoke test FAILED, rolling back" $keys
        status=1
        for k in $keys; do
          bad=$(printf %s "$pins" | jq -r --arg k "$k" '.[$k]')
          prev=$(printf %s "$pins" | jq -r --arg k "$k.previous" '.[$k]')
          kubectl patch configmap -n cluster-maintenance image-pins --type merge -p "$(jq -nc --arg k "$k" \
            --arg v "$prev" --arg p "$bad" --arg h "smoke test failed $(date +%F), rolled back" \
            '{data: {($k): $v, ($k + ".previous"): $p, ($k + ".hold"): $h}}')"
          echo "$k: $bad -> $prev (held)"
        done
        APPLY_ONLY=1 sh "$0"
        if healthy "$ns"; then echo "$ns: passes again after rollback"; else echo "$ns: still failing after rollback"; fi
      done
    }
    echo "Done"
    exit $status
{% endraw %}
---
# Runs nightly at 4am CT: moves image pins to the newest promoted (:prod) build, smoke-tests
# the apps whose pins moved (rolling back and failing the job if one doesn't pass), and
# restarts the unpinned deployments. StatefulSets are left alone — they hit the CNPG database
# and force an unnecessary primary switchover.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-image-updater
  namespace: cluster-maintenance
spec:
  schedule: "0 4 * * *"
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retries: a rerun would restart every unpinned deployment again
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: nightly-updater
          restartPolicy: Never
          containers:
            - name: updater
              # kubectl + curl + jq; keep in step with the K3s minor
              image: alpine/k8s:1.36.5
              env:
                # CI moves :prod to a build only after its tests, checks and smoke test pass
                - name: PROMOTE_TAG
                  value: prod
              command: ["/bin/sh", "/scripts/update.sh"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: nightly-updater-script
