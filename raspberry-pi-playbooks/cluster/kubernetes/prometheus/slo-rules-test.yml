      4920 4980 5040 5100 5160 5220 5280 5340 5400 5460 5520 5580 5640 5700 5760 5820 5880 5940 6000 6060 6120 6180 6240 6300 6360 6420 6480 6540 6600 6660 6720 6780 6840 6900 6960 7020 7080 7140 7200 7260
      7320 7380 7440 7500 7560 7620 7680 7740
  alert_rule_test:
  - eval_time: 2h
    alertname: NhlOddsApiFastBurn
    exp_alerts:
    - exp_labels:
        window: 1h
        severity: critical
      exp_annotations:
        summary: nhl API errors or slow (>512ms) on 14%+ of requests for 1h
        runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Runbooks#nhloddsapiburn
- name: 'API: slow Admin calls and a trickle of slow public calls do not fire'
  interval: 1m
  input_series:
