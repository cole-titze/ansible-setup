  - series: http_request_duration_seconds_count{job="nhl-odds/nhl-odds-webapi",controller="Team",endpoint="api/Team/GetTeam",code="200"}
    values: 0+0.1x130
  - series: http_request_duration_seconds_bucket{job="nhl-odds/nhl-odds-webapi",controller="Team",endpoint="api/Team/GetTeam",code="200",le="0.512"}
    values: '0x130'
  alert_rule_test:
  - eval_time: 2h
    alertname: NhlOddsApiFastBurn
    exp_alerts: []
  - eval_time: 2h
    alertname: NhlOddsApiBurn
    exp_alerts: []
- name: 'cron jobs: failing latest run and a missed daily run'
  interval: 1m
  input_series:
  - series: kube_cronjob_status_last_schedule_time{namespace="nhl-odds",cronjob="nhl-odds-entry-closing-odds"}
    values: 1000x200
  - series: kube_cronjob_status_last_successful_time{namespace="nhl-odds",cronjob="nhl-odds-entry-closing-odds"}
    values: 500x200
  - series: kube_cronjob_status_last_schedule_time{namespace="nhl-odds",cronjob="nhl-odds-entry-lineup-snapshot"}
    values: 1000x200
  - series: kube_cronjob_status_last_successful_time{namespace="nhl-odds",cronjob="nhl-odds-entry-lineup-snapshot"}
    values: 1000x200
  - series: kube_cronjob_status_last_successful_time{namespace="nhl-odds",cronjob="nhl-odds-predictor"}
    values: '0x1600'
  alert_rule_test:
  - eval_time: 1h
    alertname: CronJobFailing
    exp_alerts: []
  - eval_time: 3h
    alertname: CronJobFailing
    exp_alerts:
    - exp_labels:
        namespace: nhl-odds
        cronjob: nhl-odds-entry-closing-odds
        severity: warning
      exp_annotations:
        summary: 'nhl-odds-entry-closing-odds: latest run hasn''t succeeded for 2h+'
        runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Runbooks#cronjobfailing
  - eval_time: 25h
    alertname: DailyJobLate
    exp_alerts: []
  - eval_time: 26h
    alertname: DailyJobLate
    exp_alerts:
    - exp_labels:
        namespace: nhl-odds
        cronjob: nhl-odds-predictor
        severity: warning
      exp_annotations:
        summary: nhl-odds-predictor hasn't succeeded in 25h+
        runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Runbooks#dailyjoblate
