---
- name: Configure Prometheus + Grafana monitoring stack.
  hosts: control_plane
  gather_facts: false
  become: true

  vars:
    ansible_files_path: "{{ lookup('env', 'ANSIBLE_FILES_PATH') or '~/source/ansible-files' }}"
    # UPS (Tripp Lite BC600R, no USB port) battery: set to the install date after each swap and
    # re-run with -t prometheus. UpsBatteryReplace fires 30 months later (SLA lasts 3-5 years).
    ups_battery_installed: "2026-10-18"
    ups_battery_life_months: 30

  # alerting_vars.yml: alerting_smtp_user (Gmail address), alerting_smtp_password (Gmail app
  # password), alerting_sms_to (<10-digit number>@vtext.com, Verizon's email-to-SMS gateway)
  vars_files:
    - ../../config.yml
    - "{{ ansible_files_path }}/vars/alerting_vars.yml"

  environment:
    # The location of the kubeconfig file on the master.
    K8S_AUTH_KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    PATH: "/home/{{ ansible_user }}/go/bin:{{ ansible_facts['env']['PATH'] }}"

  tasks:
    - name: Add prometheus-community chart repo.
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: "https://prometheus-community.github.io/helm-charts"

    # Mounted by Alertmanager at /etc/alertmanager/secrets/alertmanager-smtp/, so the password
    # stays out of the Helm values
    - name: Create Alertmanager SMTP secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: alertmanager-smtp
            namespace: default
          stringData:
            password: "{{ alerting_smtp_password }}"
      no_log: true

    - name: Deploy Prometheus + Grafana Helm chart
      kubernetes.core.helm:
        name: cluster-monitoring
        chart_ref: prometheus-community/kube-prometheus-stack
        # Helm doesn't upgrade CRDs: apply the matching prometheus-operator CRDs first (see k8s-major-upgrade skill).
        chart_version: "92.10.1"
        update_repo_cache: true
        release_namespace: default
        create_namespace: true
        state: present
        values:
          # Texts warning + critical alerts to the phone through Gmail -> Verizon's email-to-SMS
          # gateway. Info alerts and Watchdog go nowhere; they stay on prometheus.kubecluster/alerts.
          alertmanager:
            enabled: true
            alertmanagerSpec:
              image:
                pullPolicy: Always
              secrets:
                - alertmanager-smtp
            config:
              global:
                smtp_smarthost: smtp.gmail.com:587
                smtp_from: "{{ alerting_smtp_user }}"
                smtp_auth_username: "{{ alerting_smtp_user }}"
                smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
                smtp_require_tls: true
              route:
                receiver: "null"
                group_by: [alertname, namespace]
                group_wait: 1m
                group_interval: 10m
                repeat_interval: 12h
                routes:
                  - receiver: sms
                    matchers:
                      - severity=~"warning|critical"
              # A critical alert silences the matching warning (same as the chart's default config)
              inhibit_rules:
                - source_matchers: [severity="critical"]
                  target_matchers: [severity=~"warning|info"]
                  equal: [namespace, alertname]
                - source_matchers: [alertname="InfoInhibitor"]
                  target_matchers: [severity="info"]
                  equal: [namespace]
              receivers:
                - name: "null"
                - name: sms
                  email_configs:
                    - to: "{{ alerting_sms_to }}"
                      send_resolved: true
                      # SMS is ~160 characters: plain text, one short line per alert
                      headers:
                        Subject: "{{ '{{' }} .Status | toUpper {{ '}}' }} {{ '{{' }} .CommonLabels.alertname {{ '}}' }}"
                      html: ""
                      text: "{{ '{{' }} range .Alerts {{ '}}' }}{{ '{{' }} .Annotations.summary {{ '}}' }}{{ '{{' }} with .Labels.nodename {{ '}}' }} ({{ '{{' }} . {{ '}}' }}){{ '{{' }} end {{ '}}' }}{{ '{{' }} with .Labels.pod {{ '}}' }} ({{ '{{' }} . {{ '}}' }}){{ '{{' }} end {{ '}}' }}\n{{ '{{' }} end {{ '}}' }}"

          # K3s runs these inside the k3s server process, so their scrape targets never exist and
          # the *Down alerts would always fire; node01 uses SQLite, not etcd
          kubeControllerManager:
            enabled: false
          kubeScheduler:
            enabled: false
          kubeProxy:
            enabled: false
          kubeEtcd:
            enabled: false

          grafana:
            image:
              pullPolicy: Always
            # Datasource ConfigMaps (e.g. Loki, loki/loki.yml) must be on disk when Grafana starts: the
            # sidecar's hot reload logs in with the secret's admin password, which the UI has changed.
            # As a native sidecar it finishes its first sync (startupProbe) before Grafana starts.
            sidecar:
              datasources:
                initDatasources: true
                restartPolicy: Always
                startupProbe:
                  httpGet:
                    path: /healthz
                    port: 8082
                  periodSeconds: 2
                  failureThreshold: 60
            # Keeps stars, preferences and UI-made dashboards across the nightly restarts.
            # Recreate: the RWO Longhorn volume can't attach to old and new pods at once.
            persistence:
              enabled: true
              storageClassName: longhorn
              size: 1Gi
            deploymentStrategy:
              type: Recreate
            grafana.ini:
              dashboards:
                # Sidecar writes each ConfigMap key to /tmp/dashboards (see "Deploy Grafana dashboards" below)
                default_home_dashboard_path: /tmp/dashboards/nhl-stack-health.json
            service:
              type: NodePort
              nodePort: 30300
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
              hosts: 
                - grafana.kubecluster
              path: /
              tls:
                - hosts:
                    - grafana.kubecluster

          # node01 carries a NoExecute control-plane taint the chart's default toleration misses
          prometheus-node-exporter:
            tolerations:
              - operator: Exists

          prometheus:
            image:
              pullPolicy: Always
            # Without a volume Prometheus loses all history on every restart. ~0.5 GB/day: 30 days
            # covers the 28-day SLO window (slo-rules.yml) with the size cap as a backstop.
            # Growing the volume: patch the PVC first (the operator can't resize it), then this.
            prometheusSpec:
              retention: 30d
              retentionSize: 20GB
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: longhorn
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 25Gi
            service:
              type: ClusterIP
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
              hosts: 
                - prometheus.kubecluster
              path: /
              tls:
                - hosts:
                    - prometheus.kubecluster

    # kube-prometheus-stack only picks up monitors labeled release=cluster-monitoring.
    # The nhl-odds PodMonitors live in nhl-odds/nhl-odds-template.yml.
    - name: Scrape Traefik and Longhorn
      kubernetes.core.k8s:
        state: present
        definition:
          - apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata:
              name: traefik
              namespace: traefik
              labels:
                release: cluster-monitoring
            spec:
              selector:
                matchLabels:
                  app: traefik
              endpoints:
                - port: admin
                  path: /metrics
          - apiVersion: monitoring.coreos.com/v1
            kind: ServiceMonitor
            metadata:
              name: longhorn
              namespace: longhorn-system
              labels:
                release: cluster-monitoring
            spec:
              selector:
                matchLabels:
                  app: longhorn-manager
              endpoints:
                - port: manager
          # Longhorn's chart NetworkPolicy only admits its own pods to the manager; policies are
          # additive, so this lets Prometheus scrape :9500 without loosening anything else.
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: longhorn-manager-prometheus
              namespace: longhorn-system
            spec:
              podSelector:
                matchLabels:
                  app: longhorn-manager
              policyTypes: [Ingress]
              ingress:
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: default
                      podSelector:
                        matchLabels:
                          prometheus: cluster-monitoring-kube-pr-prometheus
                  ports:
                    - port: 9500
                      protocol: TCP

    # Probes the public nhl-odds site from inside the cluster, out through Cloudflare and back, so it
    # catches tunnel and app outages (not this network's internet going down). nhl-odds rolls the
    # results up into one row a day (its scheduler/k8s/save-uptime.sh), past Prometheus's 15 days.
    - name: Deploy blackbox exporter
      kubernetes.core.helm:
        name: blackbox-exporter
        chart_ref: prometheus-community/prometheus-blackbox-exporter
        chart_version: "11.20.0"
        update_repo_cache: true
        release_namespace: default
        state: present
        values:
          fullnameOverride: blackbox-exporter

    # SMART data (wear, spare, temperature, media errors) from every node's NVMe drive. Its alerts text
    # the phone (warning/critical) and show on the Homelab Nodes dashboard's Disks row.
    - name: Deploy smartctl exporter
      kubernetes.core.helm:
        name: smartctl-exporter
        chart_ref: prometheus-community/prometheus-smartctl-exporter
        chart_version: "0.17.1"
        update_repo_cache: true
        release_namespace: default
        state: present
        values:
          fullnameOverride: smartctl-exporter
          # The chart's default v0.14.0 image is amd64-only; v0.15.0 is the first release with arm64
          image:
            tag: v0.15.0
          # Only the NVMe boot drives; Longhorn's iSCSI volumes show up as sd* and report nothing useful
          config:
            device_include: "nvme.*"
          # node01 carries a NoExecute control-plane taint the chart's default toleration misses
          tolerations:
            - operator: Exists
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          serviceMonitor:
            enabled: true
            extraLabels:
              release: cluster-monitoring
            # instance is the pod IP; keep the node name for dashboards and alerts
            relabelings:
              - sourceLabels: [__meta_kubernetes_pod_node_name]
                targetLabel: nodename
          prometheusRules:
            enabled: true
            extraLabels:
              release: cluster-monitoring
            rules:
              # The Pis' PCIe link is always slower than the drives' max, so this would always fire
              smartCTLDInterfaceSlow:
                enabled: false
              # The 970 EVO Plus drives idle around 65-70°C and throttle at 85°C
              smartCTLDDeviceTemperature:
                expr: smartctl_device_temperature{temperature_type="current"} > 75
                for: 10m
                annotations:
                  summary: Device has temperature higher than 75°C
                  description: Device {{ '{{' }} $labels.device {{ '}}' }} on {{ '{{' }} $labels.nodename {{ '}}' }} is above 75°C (throttles at 85°C)
              smartCTLDeviceWear:
                enabled: true
                alert: SmartCTLDeviceWear
                expr: smartctl_device_percentage_used >= 80
                for: 1h
                annotations:
                  summary: Device has used 80% of its rated endurance
                  description: Device {{ '{{' }} $labels.device {{ '}}' }} on {{ '{{' }} $labels.nodename {{ '}}' }} is {{ '{{' }} $value {{ '}}' }}% worn; plan a replacement (wiki Replacing-a-Node-SSD)
                  runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Replacing-a-Node-SSD
                labels:
                  severity: warning
              smartCTLExporterDown:
                enabled: true
                alert: SmartCTLExporterDown
                expr: up{job="smartctl-exporter"} == 0
                for: 15m
                annotations:
                  summary: smartctl exporter is not being scraped
                  description: The smartctl exporter on {{ '{{' }} $labels.nodename {{ '}}' }} has been down for 15 minutes
                labels:
                  severity: warning

    # The backup Pi's USB SSD (not in the cluster; exporter installed by utilities/backup-node-ssd.yml).
    # Same job label as the in-cluster exporter so the SmartCTL* alerts and Disks row cover it.
    - name: Scrape the backup Pi's smartctl exporter
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: monitoring.coreos.com/v1alpha1
          kind: ScrapeConfig
          metadata:
            name: smartctl-backup-pi
            namespace: default
            labels:
              release: cluster-monitoring
          spec:
            staticConfigs:
              - targets: ["{{ hostvars['dockerpi_backup'].ansible_host }}:9633"]
                labels:
                  nodename: dockerpibackup
            relabelings:
              - targetLabel: job
                replacement: smartctl-exporter

    - name: Probe the public nhl-odds site
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: Probe
          metadata:
            name: nhl-odds-public
            namespace: default
            labels:
              release: cluster-monitoring
          spec:
            # save-uptime.sh and the admin page count one probe as one minute
            interval: 60s
            module: http_2xx
            prober:
              url: blackbox-exporter.default.svc:9115
            targets:
              staticConfig:
                static:
                  - https://nhl.half-built.com/

    # Homelab alerts the chart's default rules don't cover. Warning and critical text the phone.
    - name: Deploy homelab alert rules
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: homelab-alerts
            namespace: default
            labels:
              release: cluster-monitoring
          spec:
            groups:
              - name: homelab
                rules:
                  # Single 5s timeouts happen most days; five straight failed minutes is an outage
                  - alert: NhlOddsSiteDown
                    expr: probe_success{job="probe/default/nhl-odds-public"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: nhl.half-built.com down 5+ min
                      runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Runbooks#nhloddssitedown
                  # kured reboots take a node away for ~2 minutes
                  - alert: NodeDown
                    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                    for: 10m
                    labels:
                      severity: critical
                    annotations:
                      summary: "{{ '{{' }} $labels.node {{ '}}' }} not Ready 10+ min"
                      runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Runbooks#nodedown
                  - alert: NhlOddsDatabaseNoPrimary
                    expr: absent(cnpg_pg_replication_in_recovery{cluster="nhl-odds-database"} == 0)
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: nhl-odds DB has no primary
                      runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Runbooks#nhloddsdatabasenoprimary
                  # Drains and node reboots take an instance down for a few minutes
                  - alert: NhlOddsDatabaseInstanceDown
                    expr: sum(cnpg_collector_up{cluster="nhl-odds-database"}) < 3
                    for: 20m
                    labels:
                      severity: warning
                    annotations:
                      summary: "nhl-odds DB {{ '{{' }} $value {{ '}}' }}/3 instances up"
                      runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Runbooks#nhloddsdatabaseinstancedown
                  - alert: LonghornVolumeFaulted
                    expr: longhorn_volume_robustness{state="faulted"} == 1
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Longhorn volume faulted: {{ '{{' }} $labels.pvc {{ '}}' }}"
                      runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Runbooks#longhornvolumefaulted
                  # Replicas rebuild for a while after a drain
                  - alert: LonghornVolumeDegraded
                    expr: longhorn_volume_robustness{state="degraded"} == 1
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "Longhorn volume degraded 1h+: {{ '{{' }} $labels.pvc {{ '}}' }}"
                      runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Runbooks#longhornvolumedegraded
                  # Date-only reminder (the UPS has no data port); repeats every 12h until the
                  # install date is updated
                  - alert: UpsBatteryReplace
                    expr: vector(time()) > {{ ((ups_battery_installed | to_datetime('%Y-%m-%d')).timestamp() + ups_battery_life_months * 30.44 * 86400) | int }}
                    labels:
                      severity: warning
                    annotations:
                      summary: "UPS battery installed {{ ups_battery_installed }}: replace it"
                      runbook_url: https://github.com/cole-titze/nhl-odds/wiki/Runbooks#upsbatteryreplace

    # SLOs (site availability, API errors+latency) and job-freshness alerts. Plain YAML, not a
    # template, so promtool can test the same file: see the command at the top of slo-rules.yml.
    - name: Deploy SLO rules
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: homelab-slos
            namespace: default
            labels:
              release: cluster-monitoring
          spec: "{{ lookup('file', 'slo-rules.yml') | from_yaml }}"

    # Nightly copy of grafana.db (stars, preferences, UI-made dashboards; provisioned dashboards
    # are in git) to /home/pi/backups/grafana on whichever node runs Grafana, keeping 30 days.
    # mac-playbooks/backup/grafana pulls them off both workers. The RWO volume can only be mounted
    # on Grafana's node, hence the podAffinity; SQLite's backup API makes a consistent online copy.
    - name: Schedule Grafana database backup
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: grafana-db-backup
            namespace: default
          spec:
            schedule: "30 1 * * *"
            timeZone: "America/Chicago"
            concurrencyPolicy: Forbid
            jobTemplate:
              spec:
                backoffLimit: 3
                template:
                  spec:
                    restartPolicy: OnFailure
                    # Root with only DAC_READ_SEARCH: reads Grafana's (uid 472) database and writes
                    # the root-owned hostPath dir
                    automountServiceAccountToken: false
                    securityContext:
                      seccompProfile:
                        type: RuntimeDefault
                    affinity:
                      podAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          - topologyKey: kubernetes.io/hostname
                            labelSelector:
                              matchLabels:
                                app.kubernetes.io/name: grafana
                                app.kubernetes.io/instance: cluster-monitoring
                    containers:
                      - name: backup
                        image: python:3.14.9-alpine
                        env:
                          - name: TZ
                            value: America/Chicago
                        command: ["/bin/sh", "-c"]
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop: ["ALL"]
                            add: ["DAC_READ_SEARCH"]
                        args:
                          - |
                            set -e
                            python3 - <<'EOF'
                            import datetime, os, sqlite3
                            dst = f"/backups/grafana-{datetime.date.today()}.db"
                            src = sqlite3.connect("file:/var/lib/grafana/grafana.db?mode=ro", uri=True)
                            out = sqlite3.connect(dst + ".tmp")
                            src.backup(out)
                            assert out.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
                            out.close()
                            src.close()
                            os.chmod(dst + ".tmp", 0o644)
                            os.replace(dst + ".tmp", dst)
                            print(f"Backup saved to {dst}")
                            EOF
                            find /backups -name "grafana-*.db" -mtime +30 -delete
                            echo "Old backups pruned"
                        volumeMounts:
                          - name: grafana-storage
                            mountPath: /var/lib/grafana
                            readOnly: true
                          - name: backup-storage
                            mountPath: /backups
                          - name: tmp
                            mountPath: /tmp
                    volumes:
                      - name: tmp
                        emptyDir: {}
                      - name: grafana-storage
                        persistentVolumeClaim:
                          claimName: cluster-monitoring-grafana
                          readOnly: true
                      - name: backup-storage
                        hostPath:
                          path: /home/pi/backups/grafana
                          type: DirectoryOrCreate

    # The Grafana sidecar loads any ConfigMap labeled grafana_dashboard=1. The definition is one
    # Jinja expression because Ansible (<2.19) would otherwise turn the templated JSON string into a dict.
    - name: Deploy Grafana dashboards
      kubernetes.core.k8s:
        state: present
        definition: >-
          {{ {'apiVersion': 'v1', 'kind': 'ConfigMap',
              'metadata': {'name': 'grafana-dashboard-' ~ (item | basename | splitext | first),
                           'namespace': 'default', 'labels': {'grafana_dashboard': '1'}},
              'data': {item | basename: lookup('file', item)}} }}
      loop: "{{ query('fileglob', 'dashboards/*.json') }}"
