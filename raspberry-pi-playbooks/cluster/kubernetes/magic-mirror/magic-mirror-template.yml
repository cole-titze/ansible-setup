---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magic-mirror
  namespace: magic-mirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magic-mirror
  template:
    metadata:
      labels:
        app: magic-mirror
    spec:
      # Still root: MagicMirror writes config/basepath.js and js/positions.js into the
      # root-owned image at startup, so non-root needs an image change first
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: magic-mirror
          image: ghcr.io/cole-titze/containers/magic-mirror:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: magic-mirror
  namespace: magic-mirror
spec:
  type: NodePort
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30808
      protocol: TCP
  selector:
    app: magic-mirror

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: magic-mirror
  namespace: magic-mirror
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mirror.kubecluster`)
      kind: Rule
      services:
        - name: magic-mirror
          port: 8082
  tls:
    secretName: local-cert