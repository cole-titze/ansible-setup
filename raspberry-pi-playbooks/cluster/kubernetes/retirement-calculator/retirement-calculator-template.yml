---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retirement-calculator
  namespace: retirement-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retirement-calculator
  template:
    metadata:
      labels:
        app: retirement-calculator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: retirement-calculator
                topologyKey: kubernetes.io/hostname
      containers:
        - name: retirement-calculator
          image: ghcr.io/cole-titze/retirement-calculator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: retirement-calculator
  namespace: retirement-calculator
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: retirement-calculator

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: retirement-calculator
  namespace: retirement-calculator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: retirement-calculator

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: retirement-calculator
  namespace: retirement-calculator
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`retirement-calculator.kubecluster`)
      kind: Rule
      services:
        - name: retirement-calculator
          port: 80
  tls:
    secretName: local-cert
