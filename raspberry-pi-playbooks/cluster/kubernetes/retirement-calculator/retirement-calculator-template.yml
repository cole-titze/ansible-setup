---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retirement-calculator
  namespace: retirement-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retirement-calculator
  template:
    metadata:
      labels:
        app: retirement-calculator
    spec:
      # Hard-spread replicas across worker nodes. Cordoned/tainted nodes (node01, a node being
      # drained) don't count, so drains and rolling updates still work with only two workers.
      # Only enforced at scheduling time: after a drain, a rollout restart rebalances.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: retirement-calculator
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: retirement-calculator
          image: ghcr.io/cole-titze/retirement-calculator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: retirement-calculator
  namespace: retirement-calculator
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: retirement-calculator

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: retirement-calculator
  namespace: retirement-calculator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: retirement-calculator

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: retirement-calculator
  namespace: retirement-calculator
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`retirement-calculator.kubecluster`)
      kind: Rule
      services:
        - name: retirement-calculator
          port: 80
  tls:
    secretName: local-cert

---
apiVersion: v1
kind: Secret
metadata:
  name: retirement-calculator-secret
  namespace: retirement-calculator
type: Opaque
stringData:
  cloudflare-tunnel-token: "{{ retirement_calculator_cloudflare_tunnel_token }}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: retirement-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Hard-spread replicas across worker nodes. Cordoned/tainted nodes (node01, a node being
      # drained) don't count, so drains and rolling updates still work with only two workers.
      # Only enforced at scheduling time: after a drain, a rollout restart rebalances.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: cloudflared
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:20241
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: retirement-calculator-secret
                  key: cloudflare-tunnel-token
          ports:
            - name: metrics
              containerPort: 20241
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:  # no CPU limit: CPU is shared by requests under contention, so bursting only uses idle CPU
              memory: "128Mi"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: retirement-calculator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared
