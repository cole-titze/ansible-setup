---
# Required variables (set in retirement_vars.yml):
#   retirement_calculator_cloudflare_tunnel_token

- name: Configure Retirement Calculator
  hosts: control_plane
  gather_facts: false
  become: true

  vars:
    ansible_files_path: "~/source/ansible-files"

  environment:
    K8S_AUTH_KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Load retirement vars.
      ansible.builtin.include_vars:
        file: "{{ ansible_files_path }}/vars/retirement_vars.yml"

    - name: Create retirement-calculator namespace.
      kubernetes.core.k8s:
        name: retirement-calculator
        api_version: v1
        kind: Namespace
        state: present

    - name: Apply retirement-calculator manifests.
      kubernetes.core.k8s:
        definition: "{{ lookup('template', 'retirement-calculator-template.yml') }}"
        state: present
