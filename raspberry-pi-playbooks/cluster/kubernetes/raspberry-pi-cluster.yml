---
- name: Set up cluster-wide configuration.
  hosts: cluster
  gather_facts: true
  become: true

  handlers:
    - name: reboot-pi
      ansible.builtin.reboot:

  tasks:
    - name: Ensure cgroups are configured correctly in cmdline.txt.
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '^([\w](?!.*\b{{ item }}\b).*)$'
        replace: '\1 {{ item }}'
      with_items:
        - "cgroup_memory=1"
        - "cgroup_enable=memory"
      notify: reboot-pi
      when: ansible_facts['distribution'] == 'Debian'

    - name: Download K3s install script.
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: "~/k3s_install.sh"
        mode: a+x

    - name: Install required dependencies
      ansible.builtin.apt:
        name: nfs-common
        state: present


- name: Configure storage.
  hosts: cluster
  gather_facts: false
  become: true
  vars_files:
    - ../storage/config.yml

  tasks:
    - name: Set up storage.
      include_tasks: ../storage/longhorn.yml


- name: Configure the control plane.
  hosts: control_plane
  gather_facts: false
  become: true

  vars_files:
    - ../storage/config.yml

  tasks:
    - name: Ensure k3s config directory exists.
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    # The LAN is 10.42.0.0/24 (the K3s default pod range), so pods and services get their own
    # ranges. Kept in config.yaml so upgrades that rerun the installer without flags keep them.
    # Neither range can change in place: changing one means a full uninstall + reinstall.
    - name: Write k3s server config.
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          disable:
            - traefik
          cluster-cidr: 10.52.0.0/16
          service-cidr: 10.53.0.0/16
          flannel-backend: host-gw
        mode: '0644'

    - name: Install K3s on control plane (takes a while).
      ansible.builtin.shell: >-
        INSTALL_K3S_VERSION="{{ k3s_version }}" K3S_KUBECONFIG_MODE="644" ~/k3s_install.sh >> ~/k3s_install_log.txt
      args:
        chdir: "~"
        creates: /var/lib/rancher/k3s/server/node-token

    - name: Get node token.
      ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
      changed_when: false
      register: node_token_output

    - name: Set node_token fact.
      ansible.builtin.set_fact:
        node_token: "{{ node_token_output.stdout_lines[0] }}"

    - name: Ensure required dependencies are installed.
      ansible.builtin.package:
        name:
          - python3-pip
          - python3-setuptools
          - python3-openshift
          - python3-yaml
          - build-essential
          - git
        state: present
      become: true

    - name: Install golang (takes a while).
      ansible.builtin.package:
        name: golang
        state: present
      become: true

    - name: Ignore PEP 668 because it's silly.
      ansible.builtin.file:
        path: /usr/lib/python3.11/EXTERNALLY-MANAGED
        state: absent
      become: true

    - name: Get the control plane node name
      command: kubectl get nodes -o jsonpath='{.items[0].metadata.name}'
      register: control_node
      changed_when: false

    - name: Check if the control plane is already tainted
      command: kubectl get node {{ control_node.stdout }} -o jsonpath='{.spec.taints}'
      register: node_taints
      changed_when: false

    - name: Taint the control plane node if not already tainted (NoSchedule)
      command: kubectl taint nodes {{ control_node.stdout }} node-role.kubernetes.io/control-plane:NoSchedule --overwrite
      when: "'NoSchedule' not in node_taints.stdout"

    - name: Taint the control plane node if not already tainted (NoExecute)
      command: kubectl taint nodes {{ control_node.stdout }} node-role.kubernetes.io/control-plane:NoExecute --overwrite
      when: "'NoExecute' not in node_taints.stdout"

    - name: Check if the control plane node is already cordoned
      command: kubectl get node {{ control_node.stdout }} -o jsonpath='{.spec.unschedulable}'
      register: node_unschedulable
      changed_when: false

    # Cordoning (in addition to the taints above) makes Longhorn show this node as
    # intentionally excluded rather than "down", since it never runs Longhorn's
    # manager/csi-plugin pods (see nodeAffinity in storage/longhorn.yml).
    - name: Cordon the control plane node
      command: kubectl cordon {{ control_node.stdout }}
      when: node_unschedulable.stdout != "true"


- name: Configure the worker nodes.
  hosts: nodes
  gather_facts: false
  become: true

  tasks:
    # K3s names the node after the hostname (matters for repurposed Pis like node04/dockerpi).
    - name: Set hostname to the inventory name.
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Point 127.0.1.1 at the new hostname.
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1\t{{ inventory_hostname }}"

    - name: Write the K3s resolv.conf (hosts whose own resolver is loopback).
      ansible.builtin.copy:
        dest: "{{ k3s_resolv_conf }}"
        content: |
          nameserver 10.42.0.2
          nameserver 10.42.0.3
        mode: '0644'
      when: k3s_resolv_conf is defined

    - name: Ensure k3s config directory exists.
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'
      when: k3s_resolv_conf is defined

    - name: Write k3s agent config.
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          resolv-conf: {{ k3s_resolv_conf }}
        mode: '0644'
      when: k3s_resolv_conf is defined

    - name: Install K3s on nodes (takes a while).
      ansible.builtin.shell: >-
        INSTALL_K3S_VERSION="{{ k3s_version }}"
        K3S_URL="https://{{ hostvars[groups['control_plane'][0]]['ansible_host'] }}:6443"
        K3S_TOKEN="{{ hostvars[groups['control_plane'][0]]['node_token'] }}"
        ~/k3s_install.sh >> ~/k3s_install_log.txt
      args:
        chdir: "~"
        creates: /var/lib/rancher/k3s/agent/kubelet.kubeconfig

# K3s ships CoreDNS with 1 replica; when that node was busy (the 1 AM pg_dumps) every lookup timed
# out. Its manifest has no replicas field, so the scale survives K3s restarts. The built-in
# topologySpreadConstraints put the 2 pods on different nodes.
- name: Run 2 CoreDNS replicas.
  hosts: control_plane
  gather_facts: false
  become: true

  tasks:
    - name: Scale CoreDNS to 2 replicas.
      ansible.builtin.command: kubectl -n kube-system scale deployment coredns --replicas=2
      register: coredns_scale
      changed_when: "'scaled' in coredns_scale.stdout"

