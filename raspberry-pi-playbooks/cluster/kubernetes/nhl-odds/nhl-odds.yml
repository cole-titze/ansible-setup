---
# Required variables (set in group_vars or ansible-vault):
#   nhl_odds_postgres_password
#   nhl_odds_api_key
#   nhl_odds_api_backfill_key
#
# Optional backup restore:
#   Place a pg_dump file at ~/source/ansible-files/backups/nhl-odds/nhl.dump
#   on the control machine. If present, it will be restored into the database
#   after deployment.

- name: Configure NHL Odds
  hosts: control_plane
  gather_facts: false
  become: true

  vars:
    ansible_files_path: "{{ lookup('env', 'ANSIBLE_FILES_PATH') or '~/source/ansible-files' }}"
    local_backup_path: "{{ lookup('env', 'HOME') }}/source/ansible-files/backups/nhl-odds/nhl.dump"
    # The restore Job reads the dump from this worker's disk. kubectl cp/exec of a multi-GB dump
    # into the pod times out (2026-10-17 rebuild), so nothing streams through the API server.
    restore_node: "{{ groups['storage'][0] }}"
    restore_dir: /home/pi/backups/nhl-odds
    restore_file: nhl-restore.dump
    # Elasticsearch users: the superuser (playbook and probes only) and the two least-privilege users
    # Ollama model for article embeddings (nhl-odds-embeddings); changing it re-embeds every article over the
    # next few hourly search-index runs
    nhl_odds_embedding_model: nomic-embed-text
    search_users:
      - { secret: nhl-odds-elasticsearch-credentials, username: elastic }
      - { secret: nhl-odds-search-writer-credentials, username: nhl_search_writer }
      - { secret: nhl-odds-search-reader-credentials, username: nhl_search_reader }
    # What each search role may do, on the nhl-* indices only. The writer builds a new index, fills it and
    # moves the alias (create_index, write, manage) and reads the live articles index to reuse its vectors
    # (read); the reader can only search.
    search_roles:
      nhl_search_writer: { indices: [{ names: ["nhl-*"], privileges: [create_index, write, manage, read] }] }
      nhl_search_reader: { indices: [{ names: ["nhl-*"], privileges: [read] }] }

  vars_files:
    - "{{ ansible_files_path }}/vars/nhl_vars.yml"

  environment:
    K8S_AUTH_KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    PATH: "/home/{{ ansible_user }}/go/bin:{{ ansible_facts['env']['PATH'] }}"

  tasks:
    - name: Install CloudNativePG operator.
      ansible.builtin.command: >
        kubectl apply --server-side -f
        https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.30/releases/cnpg-1.30.1.yaml
      register: cnpg_install
      changed_when: "'configured' in cnpg_install.stdout or 'created' in cnpg_install.stdout"

    # On a fresh cluster the Cluster object below is rejected until the operator's webhook is up.
    - name: Wait for the CloudNativePG operator.
      ansible.builtin.command: kubectl rollout status deployment/cnpg-controller-manager -n cnpg-system --timeout=300s
      changed_when: false

    - name: Create nhl-odds namespace.
      kubernetes.core.k8s:
        name: nhl-odds
        api_version: v1
        kind: Namespace
        state: present

    - name: Fetch NHL Odds schema SQL
      ansible.builtin.uri:
        url: https://raw.githubusercontent.com/cole-titze/nhl-odds/main/database/Scripts/CreateTables.sql
        return_content: true
      register: schema_sql
      delegate_to: localhost
      become: false

    - name: Load image pins.
      ansible.builtin.import_tasks: ../cluster-maintenance/image-pins.yml
      vars:
        image_pin_repos:
          nhl-odds-webapi: cole-titze/nhl-odds/webapi
          nhl-odds-frontend: cole-titze/nhl-odds/frontend
          nhl-odds-entry: cole-titze/nhl-odds/entry
          nhl-odds-predictor: cole-titze/nhl-odds/predictor
          nhl-odds-scheduler-k8s: cole-titze/nhl-odds/scheduler-k8s

    # Passwords for the least-privilege roles (Cluster.managed.roles) live only in the cluster:
    # created once at random, never overwritten. CNPG sets each role's password from its secret.
    - name: Read DB role secrets.
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: nhl-odds
        name: "nhl-odds-{{ item }}-credentials"
      loop: [web, writer, backup]
      register: db_role_secrets

    - name: Create missing DB role secrets.
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "nhl-odds-{{ item.item }}-credentials"
            namespace: nhl-odds
            labels:
              cnpg.io/reload: "true"
          type: kubernetes.io/basic-auth
          stringData:
            username: "nhl_{{ item.item }}"
            password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
      loop: "{{ db_role_secrets.results }}"
      loop_control:
        label: "nhl-odds-{{ item.item }}-credentials"
      when: item.resources | length == 0

    # Site search (Elasticsearch): the built-in elastic superuser's password, and one each for the indexer
    # (nhl_search_writer) and the webapi (nhl_search_reader). Like the DB roles: random, created once, cluster-only.
    - name: Read search credential secrets.
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: nhl-odds
        name: "{{ item.secret }}"
      loop: "{{ search_users }}"
      loop_control:
        label: "{{ item.secret }}"
      register: search_secrets

    - name: Create missing search credential secrets.
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.item.secret }}"
            namespace: nhl-odds
          type: kubernetes.io/basic-auth
          stringData:
            username: "{{ item.item.username }}"
            password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
      loop: "{{ search_secrets.results }}"
      loop_control:
        label: "{{ item.item.secret }}"
      when: item.resources | length == 0

    - name: Apply nhl-odds manifests.
      kubernetes.core.k8s:
        definition: "{{ lookup('template', 'nhl-odds-template.yml') }}"
        state: present

    - name: Check if local database backup exists
      ansible.builtin.stat:
        path: "{{ local_backup_path }}"
      register: backup_file
      delegate_to: localhost
      become: false

    - name: Wait for database pod to exist
      ansible.builtin.shell: |
        kubectl get pod -l cnpg.io/cluster=nhl-odds-database,role=primary -n nhl-odds --no-headers 2>/dev/null | wc -l
      register: db_pod_count
      until: db_pod_count.stdout | trim | int > 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for database pod to be ready
      ansible.builtin.shell: |
        kubectl wait --for=condition=ready pod -l cnpg.io/cluster=nhl-odds-database,role=primary -n nhl-odds --timeout=300s
      changed_when: false

    - name: Get database pod name
      ansible.builtin.command: >
        kubectl get pod -n nhl-odds -l cnpg.io/cluster=nhl-odds-database,role=primary -o jsonpath='{.items[0].metadata.name}'
      register: db_pod_name
      changed_when: false

    # Dumps carry the JobStatus grant to nhl_web, so a restore fails if CNPG hasn't created the roles yet
    - name: Wait for the managed DB roles
      ansible.builtin.shell: >
        kubectl exec -n nhl-odds {{ db_pod_name.stdout }} --
        psql -U postgres -tAc "SELECT count(*) FROM pg_roles WHERE rolname IN ('nhl_web','nhl_writer','nhl_backup')"
      register: db_role_count
      until: db_role_count.stdout | trim == '3'
      retries: 30
      delay: 10
      changed_when: false

    - name: Check if database already has data
      ansible.builtin.shell: >
        kubectl exec -n nhl-odds {{ db_pod_name.stdout }} --
        psql -U postgres -d nhl -tAc 'SELECT COUNT(*) FROM "GameCleaned"'
      register: db_row_count
      changed_when: false
      when: backup_file.stat.exists

    - name: Copy database backup to the restore node
      ansible.builtin.copy:
        src: "{{ local_backup_path }}"
        dest: "{{ restore_dir }}/{{ restore_file }}"
        mode: '0644'
      delegate_to: "{{ restore_node }}"
      when: backup_file.stat.exists and (db_row_count.stdout | trim | int == 0)

    - name: Restore database from backup
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: nhl-odds-db-restore
            namespace: nhl-odds
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/hostname: "{{ restore_node }}"
                containers:
                  - name: restore
                    image: postgres:18
                    command: ["/bin/sh", "-c"]
                    args:
                      - >-
                        set -e;
                        pg_restore -h nhl-odds-database-rw -U postgres -d nhl --clean --if-exists -j 2
                        /backups/{{ restore_file }}
                    env:
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: nhl-odds-database-superuser
                            key: password
                    volumeMounts:
                      - name: backups
                        mountPath: /backups
                        readOnly: true
                volumes:
                  - name: backups
                    hostPath:
                      path: "{{ restore_dir }}"
                      type: Directory
      when: backup_file.stat.exists and (db_row_count.stdout | trim | int == 0)

    # A few hours at most (11 GB took ~90 min on the Pis); stops at the first Complete or Failed
    - name: Wait for the restore to finish
      ansible.builtin.shell: |
        for i in $(seq 1 1080); do
          s=$(kubectl get job nhl-odds-db-restore -n nhl-odds -o jsonpath='{.status.succeeded}/{.status.failed}')
          case "$s" in 1/*) exit 0;; */1) kubectl logs -n nhl-odds job/nhl-odds-db-restore | tail -20; exit 1;; esac
          sleep 10
        done
        echo "restore still running after 3 h"; exit 1
      changed_when: false
      when: backup_file.stat.exists and (db_row_count.stdout | trim | int == 0)

    - name: Remove the restore Job
      kubernetes.core.k8s:
        state: absent
        api_version: batch/v1
        kind: Job
        name: nhl-odds-db-restore
        namespace: nhl-odds
        delete_options:
          propagationPolicy: Background
      when: backup_file.stat.exists and (db_row_count.stdout | trim | int == 0)

    - name: Remove backup from the restore node
      ansible.builtin.file:
        path: "{{ restore_dir }}/{{ restore_file }}"
        state: absent
      delegate_to: "{{ restore_node }}"
      when: backup_file.stat.exists and (db_row_count.stdout | trim | int == 0)

    - name: Analyze the restored database
      ansible.builtin.shell: >
        kubectl exec -n nhl-odds {{ db_pod_name.stdout }} -- psql -U postgres -d nhl -c 'ANALYZE'
      when: backup_file.stat.exists and (db_row_count.stdout | trim | int == 0)

    # Migration for clusters bootstrapped with owner=postgres: ensure nhl_app exists
    # and owns the nhl database + all public-schema objects. For fresh clusters the
    # role/ownership are already correct (CNPG bootstrap handles it via
    # Cluster.bootstrap.initdb.owner), so each step below is a no-op.
    - name: Check if nhl_app role exists
      ansible.builtin.shell: >
        kubectl exec -n nhl-odds {{ db_pod_name.stdout }} --
        psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='nhl_app'"
      register: nhl_app_role
      changed_when: false

    - name: Create nhl_app role
      ansible.builtin.shell: >
        kubectl exec -n nhl-odds {{ db_pod_name.stdout }} --
        psql -U postgres -c "CREATE ROLE nhl_app WITH LOGIN PASSWORD '{{ nhl_odds_postgres_password }}'"
      when: nhl_app_role.stdout | trim == ''

    # REASSIGN OWNED can't be used here — postgres owns system objects it refuses to
    # release. Walk public-schema objects explicitly instead; ALTER ... OWNER is a
    # no-op when already owned by nhl_app.
    - name: Transfer ownership of nhl database and public-schema objects to nhl_app
      ansible.builtin.shell: |
        kubectl exec -i -n nhl-odds {{ db_pod_name.stdout }} -- psql -U postgres -v ON_ERROR_STOP=1 -d nhl <<'PSQL'
        ALTER DATABASE nhl OWNER TO nhl_app;
        DO $$
        DECLARE r RECORD;
        BEGIN
          FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' LOOP
            EXECUTE format('ALTER TABLE public.%I OWNER TO nhl_app', r.tablename);
          END LOOP;
          FOR r IN SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema = 'public' LOOP
            EXECUTE format('ALTER SEQUENCE public.%I OWNER TO nhl_app', r.sequence_name);
          END LOOP;
          FOR r IN SELECT viewname FROM pg_views WHERE schemaname = 'public' LOOP
            EXECUTE format('ALTER VIEW public.%I OWNER TO nhl_app', r.viewname);
          END LOOP;
          FOR r IN SELECT matviewname FROM pg_matviews WHERE schemaname = 'public' LOOP
            EXECUTE format('ALTER MATERIALIZED VIEW public.%I OWNER TO nhl_app', r.matviewname);
          END LOOP;
        END $$;
        PSQL
      changed_when: false

    - name: Sync nhl_app password with secret
      ansible.builtin.shell: >
        kubectl exec -n nhl-odds {{ db_pod_name.stdout }} --
        psql -U postgres -c "ALTER USER nhl_app WITH PASSWORD '{{ nhl_odds_postgres_password }}'"
      changed_when: false

    # The webapi's only write: admin job requests insert/update a JobStatus row
    - name: Let nhl_web request jobs
      ansible.builtin.shell: >
        kubectl exec -n nhl-odds {{ db_pod_name.stdout }} --
        psql -U postgres -d nhl -v ON_ERROR_STOP=1 -c 'GRANT INSERT, UPDATE ON "JobStatus" TO nhl_web'
      changed_when: false

    - name: Wait for Elasticsearch
      ansible.builtin.command: kubectl rollout status statefulset/nhl-odds-elasticsearch -n nhl-odds --timeout=600s
      changed_when: false

    # Requests go through kubectl exec as the superuser, whose password is already in the pod's environment.
    # Bodies (with the users' passwords) go over stdin, so they never appear in a process list or this log.
    - name: Set up the search roles.
      ansible.builtin.command:
        cmd: >-
          kubectl exec -i -n nhl-odds nhl-odds-elasticsearch-0 -- sh -c
          'curl -fsS -u "elastic:$ELASTIC_PASSWORD" -X PUT -H "Content-Type: application/json"
          "http://localhost:9200/_security/role/{{ item.key }}" -d @-'
        stdin: "{{ item.value | to_json }}"
      loop: "{{ search_roles | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      changed_when: false

    - name: Read search user passwords.
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: nhl-odds
        name: "{{ item }}"
      loop: [nhl-odds-search-writer-credentials, nhl-odds-search-reader-credentials]
      register: search_user_secrets
      no_log: true

    - name: Set up the search users.
      ansible.builtin.command:
        cmd: >-
          kubectl exec -i -n nhl-odds nhl-odds-elasticsearch-0 -- sh -c
          'curl -fsS -u "elastic:$ELASTIC_PASSWORD" -X PUT -H "Content-Type: application/json"
          "http://localhost:9200/_security/user/{{ item.resources[0].data.username | b64decode }}" -d @-'
        stdin: >-
          {{ {'password': item.resources[0].data.password | b64decode,
              'roles': [item.resources[0].data.username | b64decode]} | to_json }}
      loop: "{{ search_user_secrets.results }}"
      changed_when: false
      no_log: true

    # The first index build, so search works now instead of at the next :20. Fails (without stopping the
    # playbook) while the pinned entry image predates RUN_MODE=SearchIndex; the CronJob picks it up once promoted.
    - name: Build the search index.
      ansible.builtin.shell: |
        job=nhl-odds-search-index-$(date +%s)
        kubectl create job -n nhl-odds --from=cronjob/nhl-odds-entry-search-index "$job"
        kubectl wait -n nhl-odds --for=condition=complete "job/$job" --timeout=600s
      changed_when: true
      ignore_errors: true

    - name: Restart webapi and scheduler to pick up credentials
      ansible.builtin.command: >
        kubectl rollout restart deployment -n nhl-odds nhl-odds-webapi nhl-odds-scheduler
      changed_when: false
