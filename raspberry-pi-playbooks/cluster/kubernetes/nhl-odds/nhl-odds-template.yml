# CronJob: Nightly database backup with 7-day retention — {{ host }}
# Dumps land at /home/pi/backups/nhl-odds/ on each node for SFTP retrieval.
# Staggered 20 min apart from 12:45am CT (node02 12:45, node03 1:05, node04 1:25) and read from a
# replica (-ro): three parallel dumps of the primary maxed its node's CPU and NIC and starved CoreDNS.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nhl-odds-db-backup-{{ host }}
  namespace: nhl-odds
spec:
  schedule: "{{ (45 + loop.index0 * 20) % 60 }} {{ (45 + loop.index0 * 20) // 60 }} * * *"
  timeZone: "America/Chicago"
  # While node02 hung (10-27), each night's Job sat Pending; on reboot all three ran at once into
  # the same dated file. Forbid skips a night while one is still active, a Job gives up after 4h
  # (a dump takes ~10 min), and a missed schedule more than 1h late is skipped.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: {{ host }}
          # Root without capabilities: enough to write the root-owned hostPath dir
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
{{ wait_for_db('nhl-odds-database-ro') }}
          containers:
            - name: backup
              image: postgres:18
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: TZ
                  value: America/Chicago
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nhl-odds-backup-credentials
                      key: password
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  mkdir -p /backups
                  BACKUP_FILE="/backups/nhl-$(date +%Y-%m-%d).dump"
                  # Dump to a temp file, so a failed or overlapping run never leaves a bad .dump
                  # for the off-node pulls
                  pg_dump -h nhl-odds-database-ro -U nhl_backup -Fc nhl > "$BACKUP_FILE.tmp"
                  mv "$BACKUP_FILE.tmp" "$BACKUP_FILE"
                  echo "Backup saved to $BACKUP_FILE"
                  find /backups -name "nhl-*.dump" -mtime +7 -delete
                  find /backups -name "nhl-*.dump.tmp" -mmin +240 -delete
                  echo "Old backups pruned"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              hostPath:
                path: /home/pi/backups/nhl-odds
                type: DirectoryOrCreate
{% endfor %}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: nhl-odds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Hard-spread replicas across worker nodes. Cordoned/tainted nodes (node01, a node being
      # drained) don't count, so drains and rolling updates still work with only two workers.
      # Only enforced at scheduling time: after a drain, a rollout restart rebalances.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: cloudflared
          matchLabelKeys:
            - pod-template-hash
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:20241
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nhl-odds-secret
                  key: cloudflare-tunnel-token
          ports:
            - name: metrics
              containerPort: 20241
          # /ready returns 200 only when at least one tunnel connection is healthy.
          # Restarts pods whose tunnel state has silently broken — the cause of
          # recurring intermittent 502s even while pods reported Running.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:  # no CPU limit: CPU is shared by requests under contention, so bursting only uses idle CPU
              memory: "128Mi"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: nhl-odds
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared

---
# ServiceAccount + RBAC for the scheduler to create/delete Jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nhl-odds-scheduler
  namespace: nhl-odds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nhl-odds-scheduler
  namespace: nhl-odds
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nhl-odds-scheduler
  namespace: nhl-odds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nhl-odds-scheduler
subjects:
  - kind: ServiceAccount
    name: nhl-odds-scheduler
    namespace: nhl-odds
---
# Scheduler: polls DB every minute for requested jobs and creates Kubernetes Jobs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhl-odds-scheduler
  namespace: nhl-odds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nhl-odds-scheduler
  template:
    metadata:
      labels:
        app: nhl-odds-scheduler
    spec:
      serviceAccountName: nhl-odds-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: "{{ image_pins['nhl-odds-scheduler-k8s'] }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: TZ
              value: America/Chicago
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nhl-odds-writer-credentials
                  key: password
            - name: NHL_DATABASE_URL
              value: "postgresql://nhl_writer:$(POSTGRES_PASSWORD)@nhl-odds-database-rw:5432/nhl"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

---
# Prometheus scrapes (kube-prometheus-stack only selects monitors labeled release=cluster-monitoring).
# Per-route request rate/latency from the webapi; public traffic bypasses Traefik, so this is the
# only place real-user response times are measured.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nhl-odds-webapi
  namespace: nhl-odds
  labels:
    release: cluster-monitoring
spec:
  selector:
    matchLabels:
      app: nhl-odds-webapi
  podMetricsEndpoints:
    - port: metrics
      # prometheus-net's route label is "endpoint", which collides with the target label of the
      # same name (the port); without this it's renamed exported_endpoint and the dashboard loses it.
      honorLabels: true
---
# Public request rate and status codes at the Cloudflare tunnel
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  namespace: nhl-odds
  labels:
    release: cluster-monitoring
spec:
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
    - port: metrics
---
# CNPG's built-in exporter (cnpg_* metrics); written by hand since the Cluster's enablePodMonitor is deprecated
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nhl-odds-database
  namespace: nhl-odds
  labels:
    release: cluster-monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: nhl-odds-database
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
