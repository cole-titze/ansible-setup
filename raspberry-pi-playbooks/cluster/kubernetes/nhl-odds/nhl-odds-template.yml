apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: nhl-odds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Hard-spread replicas across worker nodes. Cordoned/tainted nodes (node01, a node being
      # drained) don't count, so drains and rolling updates still work with only two workers.
      # Only enforced at scheduling time: after a drain, a rollout restart rebalances.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: cloudflared
          matchLabelKeys:
            - pod-template-hash
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:20241
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nhl-odds-secret
                  key: cloudflare-tunnel-token
          ports:
            - name: metrics
              containerPort: 20241
          # /ready returns 200 only when at least one tunnel connection is healthy.
          # Restarts pods whose tunnel state has silently broken — the cause of
          # recurring intermittent 502s even while pods reported Running.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:  # no CPU limit: CPU is shared by requests under contention, so bursting only uses idle CPU
              memory: "128Mi"

