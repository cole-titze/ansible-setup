              image: "{{ image_pins['nhl-odds-entry'] }}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: TZ
                  value: America/Chicago
                - name: RUN_MODE
                  value: NhlAdd
                # The NHL API returns 429s when requests aren't spaced out
                - name: THROTTLE_TIME_MS
                  value: "250"
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nhl-odds-writer-credentials
                      key: password
                - name: NHL_DATABASE
                  value: "Host=nhl-odds-database-rw;Database=nhl;Username=nhl_writer;Password=$(POSTGRES_PASSWORD)"

