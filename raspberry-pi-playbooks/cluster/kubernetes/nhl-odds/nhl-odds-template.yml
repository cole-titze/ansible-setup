  name: nhl-odds-entry-closing-odds
  namespace: nhl-odds
spec:
  schedule: "*/5 4-23 * * *"
  timeZone: "America/Chicago"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # One retry: a failed request costs no credits, and the game usually hasn't started yet
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
{{ wait_for_db() }}
