{#- A new pod's connections are refused for a few seconds until kube-router on every node has its IP
    (network-policies), so short-lived pods wait for the database before their main container starts. #}
{% macro wait_for_db(service='nhl-odds-database-rw') %}
          initContainers:
            - name: wait-for-db
              image: busybox:1.38
              command: ["sh", "-c", "for i in $(seq 60); do nc -z -w1 {{ service }} 5432 && sleep 2 && exit 0; sleep 1; done; echo '{{ service }}:5432 unreachable'; exit 1"]
              securityContext:
                runAsUser: 65534
                runAsGroup: 65534
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
{%- endmacro %}
---
apiVersion: v1
kind: Secret
metadata:
  name: nhl-odds-secret
  namespace: nhl-odds
type: Opaque
stringData:
  odds-api-key: "{{ nhl_odds_api_key }}"
  api-backfill-key: "{{ nhl_odds_api_backfill_key }}"
  cloudflare-tunnel-token: "{{ nhl_odds_cloudflare_tunnel_token }}"
  # Required in the X-Admin-Key header by the webapi's job-starting admin endpoints
  admin-api-key: "{{ nhl_odds_admin_api_key }}"

---
# Owner credentials (nhl_app owns the database and every table). Only CNPG bootstrap and schema
# changes use it; workloads connect as the least-privilege roles in Cluster.managed.roles.
apiVersion: v1
kind: Secret
metadata:
  name: nhl-odds-app-credentials
  namespace: nhl-odds
type: kubernetes.io/basic-auth
stringData:
  username: nhl_app
  password: "{{ nhl_odds_postgres_password }}"

---
# Schema ConfigMap — SQL fetched from nhl-odds repo at deploy time
apiVersion: v1
kind: ConfigMap
metadata:
  name: nhl-odds-schema
  namespace: nhl-odds
data:
  create-tables.sql: |
    {{ schema_sql.content | indent(4) }}

---
# One Longhorn replica, kept on the instance's own node: CNPG already keeps a copy per worker, so
# more Longhorn replicas would only add write traffic. (On the old 100 Mb links, 3 replicas per
# instance timed out and rebuilt nonstop under bulk writes in the 2026-10-17 rebuild restore; the
# nodes are on 1 Gb networking now.)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-db
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  dataLocality: "best-effort"
  staleReplicaTimeout: "30"
---
# CloudNativePG Cluster — replaces plain Deployment + PVC
# CNPG automatically creates services: nhl-odds-database-rw (primary), nhl-odds-database-r (any), nhl-odds-database-ro (replicas)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nhl-odds-database
  namespace: nhl-odds
spec:
  instances: 3  # one per worker (node02-04)
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  # enableSuperuserAccess stays true so ansible can still `psql -U postgres` via peer auth
  # in-pod during deploys. CNPG auto-manages the superuser password in a generated secret;
  # no component connects as postgres over the network.
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: nhl
      owner: nhl_app
      secret:
        name: nhl-odds-app-credentials
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: nhl-odds-schema
            key: create-tables.sql
  # Least-privilege login roles; the playbook creates their password secrets once. The built-in
  # pg_read/write_all_data roles also cover tables added later by hand (no per-table grants).
  # nhl_web additionally gets INSERT/UPDATE on "JobStatus" (admin job requests) from the playbook.
  managed:
    roles:
      - name: nhl_web       # webapi: reads everything, writes only JobStatus
        login: true
        inRoles: [pg_read_all_data]
        passwordSecret:
          name: nhl-odds-web-credentials
      - name: nhl_writer    # entry/predictor/scheduler jobs: read + write rows, no DDL
        login: true
        inRoles: [pg_read_all_data, pg_write_all_data]
        passwordSecret:
          name: nhl-odds-writer-credentials
      - name: nhl_backup    # pg_dump
        login: true
        inRoles: [pg_read_all_data]
        passwordSecret:
          name: nhl-odds-backup-credentials
  storage:
    size: 30Gi
    storageClass: longhorn-db
  # Instances must never share a node. During a drain the evicted instance waits (Pending)
  # until its node is uncordoned instead of doubling up, and the other two keep a standby.
  affinity:
    podAntiAffinityType: required
  # The DB is ~11GB, but ~9GB is GoalReplayPosition/GameShift/raw API archive that only
  # batch jobs read. 4Gi keeps the hot tables cached; workers have 16GB. No CPU limit.
  resources:
    requests:
      cpu: "250m"
      memory: "1.5Gi"
    limits:
      memory: "4Gi"
  postgresql:
    parameters:
      shared_buffers: "1GB"           # Postgres's own page cache, ~25% of the limit
      effective_cache_size: "3GB"     # planner hint: shared_buffers + OS cache expected within the limit
      work_mem: "16MB"                # per sort/hash step, so big predictor/nhl-add queries sort in memory
      hot_standby_feedback: "on"      # the nightly pg_dumps read a replica; keeps vacuum from cancelling them

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhl-odds-webapi
  namespace: nhl-odds
spec:
  replicas: 3  # one per worker (node02-04)
  selector:
    matchLabels:
      app: nhl-odds-webapi
  template:
    metadata:
      labels:
        app: nhl-odds-webapi
    spec:
      # Hard-spread replicas across worker nodes. Cordoned/tainted nodes (node01, a node being
      # drained) don't count, so drains and rolling updates still work with only two workers.
      # Only enforced at scheduling time: after a drain, a rollout restart rebalances.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: nhl-odds-webapi
          matchLabelKeys:
            - pod-template-hash
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webapi
          image: "{{ image_pins['nhl-odds-webapi'] }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
            # Prometheus metrics (prometheus-net), kept off the Service so nginx/Cloudflare can't reach it
            - name: metrics
              containerPort: 9091
          env:
            - name: TZ
              value: America/Chicago
            # With no CPU limit .NET sees every core and Server GC sizes itself for all of them
            # (measured: ~120Mi heap even with GCHeapCount=1). Workstation GC suits this low-traffic
            # API and keeps the heap at ~75-85Mi idle. MCP get_all_teams serializes ~1.9MB per call and
            # pushed the heap to the ~192Mi default cap (75% of 256Mi), causing GC pauses, hence 512Mi.
            - name: DOTNET_gcServer
              value: "0"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nhl-odds-web-credentials
                  key: password
            - name: NHL_DATABASE
              value: "Host=nhl-odds-database-rw;Database=nhl;Username=nhl_web;Password=$(POSTGRES_PASSWORD)"
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nhl-odds-secret
                  key: admin-api-key
            # The site's chat assistant asks Ollama on the Mac (Wi-Fi, DHCP-reserved .60; Ollama's
            # "Expose Ollama to the network" setting on; mac-playbooks/macbook-setup.md). Remove to
            # turn the assistant off. Egress from nhl-odds is open, so no network policy is needed.
            - name: OLLAMA_URL
              value: http://10.42.0.60:11434
            # Site search (/api/Search) as the read-only nhl_search_reader; remove the three to turn it off
            - name: ELASTICSEARCH_URL
              value: http://nhl-odds-elasticsearch:9200
            - name: ELASTICSEARCH_USERNAME
              value: nhl_search_reader
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nhl-odds-search-reader-credentials
                  key: password
            # Semantic article search: the query embedded by the in-cluster model (nhl-odds-embeddings-query below,
            # its own server so the search-index job's batches never hold it up). Remove to search articles by
            # keyword alone; down, search falls back to keywords for a minute at a time
            - name: EMBEDDING_URL
              value: http://nhl-odds-embeddings-query:11434
            - name: EMBEDDING_MODEL
              value: "{{ nhl_odds_embedding_model }}"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
          # Keep serving for 5s after the pod starts terminating: it leaves the Service at once, but
          # every node's routing takes a moment to catch up, and requests sent meanwhile would be dropped
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:  # no CPU limit: CPU is shared by requests under contention, so bursting only uses idle CPU
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: nhl-odds-webapi
  namespace: nhl-odds
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: nhl-odds-webapi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nhl-odds-webapi
  namespace: nhl-odds
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nhl-odds-webapi

---
# Elasticsearch for site search (#149). Three nodes, one per worker, so search survives a node going down (a kured
# reboot, a dead Pi): all three are master-eligible, so any two keep a quorum, and nhl-odds creates its indices with
# auto_expand_replicas 0-1, so every shard has a copy on a second node. The index is still rebuilt from Postgres
# every hour by the search-index CronJob, so it needs no backups.
# Security is on: the playbook sets up nhl_search_writer (the CronJob) and nhl_search_reader (the webapi), and the
# built-in elastic superuser is only used by the playbook and the probes. Reachable only inside the namespace
# (network-policies allow-same-namespace); no Service port leaves the cluster.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nhl-odds-elasticsearch
  namespace: nhl-odds
spec:
  replicas: 3
  # The headless Service gives each pod a DNS name (nhl-odds-elasticsearch-0.nhl-odds-elasticsearch-nodes) for discovery
  serviceName: nhl-odds-elasticsearch-nodes
  # All at once: a pod isn't ready until the cluster has elected a master, which takes two of them, so OrderedReady
  # would wait forever on pod 0
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nhl-odds-elasticsearch
  template:
    metadata:
      labels:
        app: nhl-odds-elasticsearch
    spec:
      # One per node: two on the same Pi would lose the quorum with it. While a node is drained its pod waits
      # (Pending) for it to come back; the other two keep search up (the PDB below allows one down at a time)
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: nhl-odds-elasticsearch
      automountServiceAccountToken: false
      # The image runs as uid 1000, gid 0; fsGroup makes the data volume writable for it
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          # The official image; arm64 build. Pinned: a major/minor bump can change index formats
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # Not read-only: the entrypoint writes ELASTIC_PASSWORD into the keystore under config/
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: cluster.name
              value: nhl-odds
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: discovery.seed_hosts
              value: >-
                nhl-odds-elasticsearch-0.nhl-odds-elasticsearch-nodes,nhl-odds-elasticsearch-1.nhl-odds-elasticsearch-nodes,nhl-odds-elasticsearch-2.nhl-odds-elasticsearch-nodes
            # Only read when the cluster first forms (empty data volumes); a formed cluster ignores it
            - name: cluster.initial_master_nodes
              value: nhl-odds-elasticsearch-0,nhl-odds-elasticsearch-1,nhl-odds-elasticsearch-2
            # Heap at half the memory limit; the rest is Lucene's off-heap memory and page cache
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            # mmap needs vm.max_map_count >= 262144 on the node; niofs works without touching the hosts
            - name: node.store.allow_mmap
              value: "false"
            - name: xpack.security.enabled
              value: "true"
            # Plain HTTP inside the namespace, like Postgres
            - name: xpack.security.http.ssl.enabled
              value: "false"
            # Node-to-node traffic must be TLS once there's more than one node with security on (a bootstrap check).
            # One cert for all three from the playbook's own CA; "certificate" checks it's signed by that CA, not
            # the hostname, so one cert fits every pod
            - name: xpack.security.transport.ssl.enabled
              value: "true"
            - name: xpack.security.transport.ssl.verification_mode
              value: certificate
            - name: xpack.security.transport.ssl.key
              value: certs/transport.key
            - name: xpack.security.transport.ssl.certificate
              value: certs/transport.crt
            - name: xpack.security.transport.ssl.certificate_authorities
              value: certs/ca.crt
            # Features search doesn't use: machine learning, the GeoIP database download, usage stats
            - name: xpack.ml.enabled
              value: "false"
            - name: ingest.geoip.downloader.enabled
              value: "false"
            - name: telemetry.optIn
              value: "false"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nhl-odds-elasticsearch-credentials
                  key: password
          # Cluster health as the superuser: the same check the playbook waits on
          startupProbe:
            exec:
              command: ["sh", "-c", "curl -fsS -u \"elastic:$ELASTIC_PASSWORD\" 'http://localhost:9200/_cluster/health?timeout=2s' > /dev/null"]
            periodSeconds: 10
            failureThreshold: 30  # starting the JVM takes a minute or two on a Pi
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -fsS -u \"elastic:$ELASTIC_PASSWORD\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' > /dev/null"]
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9200
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "1.5Gi"
            limits:  # no CPU limit, like the other workloads
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: transport-certs
              mountPath: /usr/share/elasticsearch/config/certs
              readOnly: true
      volumes:
        - name: transport-certs
          secret:
            secretName: nhl-odds-elasticsearch-transport-certs
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-db  # one Longhorn replica: Elasticsearch keeps its own copy on another node
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: nhl-odds-elasticsearch
  namespace: nhl-odds
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      protocol: TCP
  selector:
    app: nhl-odds-elasticsearch

---
# Discovery and node-to-node traffic. Lists pods before they're ready, since they only become ready once
# they've found each other and elected a master
apiVersion: v1
kind: Service
metadata:
  name: nhl-odds-elasticsearch-nodes
  namespace: nhl-odds
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: transport
      port: 9300
      targetPort: 9300
      protocol: TCP
  selector:
    app: nhl-odds-elasticsearch

---
# One node down at a time (a drain, a kured reboot): the other two keep the quorum and a copy of every shard
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nhl-odds-elasticsearch
  namespace: nhl-odds
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: nhl-odds-elasticsearch

# Embeddings for semantic article search: Ollama serving one small embedding model on the CPU (nomic-embed-text,
# 137M parameters, ~300 MB). A short search query embeds in well under 100 ms on a Pi 5; the hourly search-index
# CronJob only sends new and changed articles. In the cluster rather than on the Mac so search never depends on the
# Mac being awake. Nothing here is precious: the model re-downloads if a volume is lost.
# Two copies of the same server: nhl-odds-embeddings for the search-index job's batches and nhl-odds-embeddings-query
# for the webapi's search queries. Ollama runs embedding models with one slot whatever OLLAMA_NUM_PARALLEL says, so
# on one server a query waits behind a batch request (~10 s each on a busy Pi) past the webapi's 2 s timeout, and
# search drops to keywords while a big re-embed runs. Kept on different nodes when there's room, since a batch takes
# every core of its node. Two replicas of each, so a drain or kured reboot never takes one away; a StatefulSet so
# each replica keeps its own copy of the model (ReadWriteOnce volumes can't be shared across nodes).
{% for emb in [
  {'name': 'nhl-odds-embeddings', 'other': 'nhl-odds-embeddings-query'},
  {'name': 'nhl-odds-embeddings-query', 'other': 'nhl-odds-embeddings'},
] %}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ emb.name }}
  namespace: nhl-odds
spec:
  replicas: 2
  serviceName: {{ emb.name }}
  podManagementPolicy: Parallel
  # Keep the model volumes if the set is scaled down or deleted (re-pulling is cheap, but nothing gains from it)
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: {{ emb.name }}
  template:
    metadata:
      labels:
        app: {{ emb.name }}
    spec:
      # Spread the two replicas over nodes first, then away from the other server's
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: {{ emb.name }}
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: {{ emb.other }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Pulls the model before the server takes requests (a no-op once it's on the volume). Needs egress to
      # registry.ollama.ai, which nhl-odds has
      initContainers:
        - name: pull-model
          image: ollama/ollama:0.40.15
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "ollama serve >/dev/null 2>&1 & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$MODEL\""]
          env:
            - name: HOME  # Ollama writes its key pair under ~/.ollama
              value: /tmp
            - name: OLLAMA_MODELS
              value: /models
            - name: MODEL
              value: "{{ nhl_odds_embedding_model }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: ollama
          # Multi-arch image; pinned like Elasticsearch so a rollout can't change the server under the model
          image: ollama/ollama:0.40.15
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: OLLAMA_MODELS
              value: /models
            # Keep the model loaded: a cold load would make the first search after idle wait seconds
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            # Embedding only; never pull or serve anything else at the API's request
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: MODEL
              value: "{{ nhl_odds_embedding_model }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 11434
          # Ready only once the model answers an embed. Ollama loads a model on its first request, not at start, and
          # drops the load if that client gives up: the webapi's 2 s query timeout is shorter than a load on a Pi, so
          # without this a fresh query server never warms up. Also reloads it if it's ever unloaded. Long timeout
          # because on the batch server the probe waits behind a batch request
          readinessProbe:
            exec:
              command: ["sh", "-c", "ollama run \"$MODEL\" ready >/dev/null"]
            periodSeconds: 15
            timeoutSeconds: 60
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:  # no CPU limit, like the other workloads; the model and a batch fit well inside this
              memory: "1.5Gi"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-db  # one Longhorn replica: a lost model is just pulled again
        resources:
          requests:
            storage: 2Gi

