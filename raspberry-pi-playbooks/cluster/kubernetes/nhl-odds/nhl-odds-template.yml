# CronJob: Daily NHL data collection (3am CT) — replaces scheduler/daily-data-collection.sh
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nhl-odds-entry-nhl-add
  namespace: nhl-odds
spec:
  schedule: "0 3 * * *"
  timeZone: "America/Chicago"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
{{ wait_for_db() }}
          containers:
