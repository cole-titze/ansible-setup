---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhl-odds-frontend
  namespace: nhl-odds
spec:
  # Two per worker: each Node.js server renders pages on one core. A 300-user load test
  # (admin page) maxed out all four on two workers (~90 req/s) while the workers had spare cores
  replicas: 6
  selector:
    matchLabels:
      app: nhl-odds-frontend
  template:
    metadata:
      labels:
        app: nhl-odds-frontend
    spec:
      # Hard-spread replicas across worker nodes. Cordoned/tainted nodes (node01, a node being
      # drained) don't count, so drains and rolling updates still work with only two workers.
      # Only enforced at scheduling time: after a drain, a rollout restart rebalances.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: nhl-odds-frontend
          matchLabelKeys:
            - pod-template-hash
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ image_pins['nhl-odds-frontend'] }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Node server: renders pages (fetching from the API directly), serves assets,
          # and proxies /api and /mcp to the API
          env:
            - name: API_URL
              value: "http://nhl-odds-webapi:8080"
            # Keeps the heap well inside the memory limit (uncapped it grew to ~240 MB)
            - name: NODE_OPTIONS
              value: "--max-old-space-size=96"
          ports:
            - containerPort: 8080
          # Keep serving for 5s after the pod starts terminating: it leaves the Service at once, but
          # every node's routing takes a moment to catch up, and requests sent meanwhile would be dropped
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # /healthz doesn't render a page or call the web API. It still waits behind pages being
          # rendered, so the timeout allows for a busy server (1s took pods out under load).
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            # Room for the page cache (up to 64 MB of rendered pages, outside the JS heap) on top
            # of the ~180Mi a pod reaches under a Max load test
            limits:  # no CPU limit: CPU is shared by requests under contention, so bursting only uses idle CPU
              memory: "320Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

