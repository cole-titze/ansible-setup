---
- name: Install Longhorn on Kubernetes
  hosts: control_plane
  become: true
  gather_facts: false

  vars:
    ansible_files_path: "{{ lookup('env', 'ANSIBLE_FILES_PATH') or '~/source/ansible-files' }}"

  vars_files:
    - "{{ ansible_files_path }}/vars/cluster_vars.yml"

  environment:
    K8S_AUTH_KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Add Longhorn Helm repo
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: https://charts.longhorn.io

    - name: Create longhorn-system namespace
      kubernetes.core.k8s:
        state: present
        kind: Namespace
        name: longhorn-system

    - name: Install Longhorn via Helm
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn/longhorn
        # Upgrade one minor at a time (e.g. 1.11 -> 1.12 -> 1.13); see the k8s-major-upgrade skill.
        chart_version: "1.13.0"
        update_repo_cache: true
        release_namespace: longhorn-system
        create_namespace: false
        state: present
        values:
          persistence:
            defaultClass: true
            defaultClassReplicaCount: 3
          defaultSettings:
            defaultReplicaCount: 3
            replicaSoftAntiAffinity: false
            # best-effort moved replicas between nodes during rebuilds, over the same 100 Mb links.
            replicaAutoBalance: disabled
            defaultDataPath: "/var/lib/longhorn"
            # Live-upgrade volume engines after a Longhorn upgrade, one volume per node at a time.
            concurrentAutomaticEngineUpgradePerNodeLimit: 1
            # The CNPG volumes have 1 replica (CNPG keeps its own 3 copies), so the default
            # block-if-contains-last-replica blocks every worker drain and kured skips its reboots.
            # This lets a drain through once the evicted DB pod's volume has detached.
            nodeDrainPolicy: allow-if-replica-is-stopped
            # The nodes have 100 Mb links. Parallel rebuilds after a reboot saturate the sending
            # node, its replica I/O times out at the default 8s, and every rebuild restarts at 0%.
            concurrentReplicaRebuildPerNodeLimit: 1
            engineReplicaTimeout: '{"v1":"30","v2":"30"}'

    - name: Exclude control-plane node from Longhorn manager DaemonSet
      ansible.builtin.shell: |
        kubectl patch daemonset longhorn-manager -n longhorn-system --type=merge -p '{"spec":{"template":{"spec":{"affinity":{"nodeAffinity":{"requiredDuringSchedulingIgnoredDuringExecution":{"nodeSelectorTerms":[{"matchExpressions":[{"key":"node-role.kubernetes.io/control-plane","operator":"DoesNotExist"}]}]}}}}}}}'
      changed_when: false

    # Only exists if longhorn-manager ever ran on node01 (old clusters); a fresh install never
    # registers it because of the affinity above, so there's nothing to patch.
    - name: Disable Longhorn scheduling on control-plane node
      ansible.builtin.shell: |
        if kubectl get nodes.longhorn.io node01 -n longhorn-system >/dev/null 2>&1; then
          kubectl patch nodes.longhorn.io node01 -n longhorn-system --type=merge -p '{"spec":{"allowScheduling":false}}'
        fi
      changed_when: false

    # The UI has no login of its own (and can delete volumes), so it's only reachable through
    # longhorn.kubecluster behind basic auth. It was a NodePort (30880) until 2026-10-18; this
    # patch turns that back into the chart's ClusterIP on clusters that still have it.
    - name: Keep Longhorn frontend ClusterIP-only
      ansible.builtin.shell: |
        kubectl patch svc longhorn-frontend -n longhorn-system -p '{"spec":{"type":"ClusterIP"}}'
      register: longhorn_svc_patch
      changed_when: "'no change' not in longhorn_svc_patch.stdout"

    - name: Create Longhorn UI login secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: dashboard-auth
            namespace: longhorn-system
          type: kubernetes.io/basic-auth
          stringData:
            username: "{{ dashboard_username }}"
            password: "{{ dashboard_password }}"
      no_log: true

    - name: Create Longhorn UI basic-auth Middleware
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: dashboard-auth
            namespace: longhorn-system
          spec:
            basicAuth:
              secret: dashboard-auth

    - name: Create Longhorn IngressRoute
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: longhorn
            namespace: longhorn-system
          spec:
            entryPoints:
              - websecure
            routes:
              - match: Host(`longhorn.kubecluster`)
                kind: Rule
                middlewares:
                  - name: dashboard-auth
                services:
                  - name: longhorn-frontend
                    port: 80
            tls:
              secretName: local-cert

    - name: Wait for Longhorn pods to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: longhorn-system
      register: longhorn_pods
      until: >
        longhorn_pods.resources
        | selectattr('status.containerStatuses', 'defined')
        | map(attribute='status.containerStatuses')
        | flatten
        | selectattr('ready', 'equalto', true)
        | list
        | length >= longhorn_pods.resources | length
      retries: 30
      delay: 10

    - name: Patch default storage class (optional)
      kubernetes.core.k8s:
        state: patched
        kind: StorageClass
        name: longhorn
        api_version: storage.k8s.io/v1
        definition:
          metadata:
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"