---
# The backup Pi pulls the nightly nhl-odds dump (keeps 30) and the Grafana DBs (keeps 35) off the
# workers at 4:00, so a copy survives losing the cluster, and the Mac's nightly copy to iCloud reads
# them from there (backup-node-jobs.yml). Workers only let its key read their backups dir.
- name: Create the backup Pi's pull key
  hosts: backup_raspberrypi
  gather_facts: false
  become: true

  tasks:
    - name: Generate SSH key for pulling dumps
      community.crypto.openssh_keypair:
        path: /root/.ssh/nhl_backup_pull
        type: ed25519
        comment: nhl-backup-pull@{{ inventory_hostname }}
      register: pull_key

- name: Let the backup Pi read the backups on workers
  hosts: nodes
  gather_facts: false
  become: true

  tasks:
    # Rooted at backups/, so the pull script asks for nhl-odds/<file> and grafana/
    - name: Authorize the pull key, limited to read-only rsync of the backups dir
      ansible.posix.authorized_key:
        user: pi
        key: "{{ hostvars[groups['backup_raspberrypi'][0]].pull_key.public_key }}"
        key_options: 'restrict,command="/usr/bin/rrsync -ro /home/pi/backups"'

- name: Schedule the nightly pull on the backup Pi
  hosts: backup_raspberrypi
  gather_facts: false
  become: true

  tasks:
    - name: Copy pull script
      ansible.builtin.copy:
        src: files/nhl-backup-pull.sh
        dest: /usr/local/bin/nhl-backup-pull.sh
        mode: "0755"
        owner: root
        group: root

    - name: Ensure backup directories exist
      ansible.builtin.file:
        path: "/home/pi/backups/{{ item }}"
        state: directory
        mode: "0755"
      loop: [nhl-odds, grafana]

    # Also pulls the Grafana DBs (1:30); the cron name is kept so the line is updated in place.
    # Dumps start at 1:00 and take ~25 min; worker updates/reboots run 1:15–1:45
    - name: Add nightly pull cron
      ansible.builtin.cron:
        name: "Pull nhl-odds DB dump"
        job: "/usr/local/bin/nhl-backup-pull.sh {{ groups['nodes'] | map('extract', hostvars, 'ansible_host') | join(' ') }} >> /var/log/nhl-backup-pull.log 2>&1"
        minute: "0"
        hour: "4"
        user: root

    - name: Configure logrotate for the pull log
      ansible.builtin.copy:
        dest: /etc/logrotate.d/nhl-backup-pull
        content: |
          /var/log/nhl-backup-pull.log {
              monthly
              rotate 6
              compress
              missingok
              notifempty
          }
        mode: "0644"
