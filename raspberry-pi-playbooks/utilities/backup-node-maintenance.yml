---
- name: Configure staggered backup node maintenance
  hosts: backup_raspberrypi
  gather_facts: false
  become: true

  tasks:
    - name: Remove generic nightly update cron (installed by raspberry-pi role)
      ansible.builtin.cron:
        name: "Nightly system update"
        state: absent
        user: root

    - name: Configure logrotate for node logs
      ansible.builtin.copy:
        dest: /etc/logrotate.d/backup-maintenance
        content: |
          /var/log/node-update.log
          /var/log/pihole-update.log
          /var/log/pihole-failover.log {
              weekly
              rotate 4
              compress
              missingok
              notifempty
          }
        mode: '0644'

    # The old cron ran the raspberry-pi role's update-system.sh, which rebooted every night.
    - name: Remove old nightly update cron
      ansible.builtin.cron:
        name: "Docker node nightly update"
        state: absent
        user: root

    - name: Remove old update script
      ansible.builtin.file:
        path: /usr/local/bin/update-system.sh
        state: absent

    - name: Deploy update script (reboots only when required)
      ansible.builtin.copy:
        src: files/backup-node-update.sh
        dest: /usr/local/bin/backup-node-update.sh
        owner: root
        group: root
        mode: '0755'

    - name: Add staggered nightly update cron
      ansible.builtin.cron:
        name: "Backup node nightly update"
        job: "/usr/local/bin/backup-node-update.sh >> /var/log/node-update.log 2>&1"
        minute: "{{ update_cron_minute }}"
        hour: "{{ update_cron_hour }}"
        user: root
