---
- name: Setup Raspberry Pi
  hosts: raspberrypis
  become: true
  roles:
    - raspberry-pi

  post_tasks:
    # For checking drives by hand (smartctl -a /dev/nvme0); the cluster's smartctl exporter brings its own.
    # Without recommends it would also pull in an MTA for smartd's mail alerts.
    - name: Install smartmontools
      ansible.builtin.apt:
        name: smartmontools
        state: present
        install_recommends: false
        update_cache: true
      # pikvm is Arch (pacman)
      when: inventory_hostname in groups['cluster'] + groups['backup_raspberrypi']

    # Raspberry Pi OS keeps the journal in RAM, so a hang left no logs (node02, 10-27). On disk it
    # survives the reboot (journalctl -b -1); capped so it can't fill the drive. Alloy reads it from
    # /var/log/journal (cluster/kubernetes/loki/loki.yml). Named to sort after the OS's
    # 40-rpi-volatile-storage.conf, which it overrides.
    - name: Make the journald drop-in folder
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"
      when: inventory_hostname in groups['cluster'] + groups['backup_raspberrypi']

    - name: Keep the journal on disk
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/90-persistent.conf
        content: |
          [Journal]
          Storage=persistent
          SystemMaxUse=500M
        mode: "0644"
      register: journald_conf
      when: inventory_hostname in groups['cluster'] + groups['backup_raspberrypi']

    - name: Restart journald and move the RAM journal to disk
      ansible.builtin.shell: systemctl restart systemd-journald && journalctl --flush
      when: journald_conf is changed

    # The hardware watchdog (on by default, 40-rpi-enable-watchdog.conf) only catches a frozen
    # kernel; node02 lost its network for 3 days (10-27) with systemd still running. See the script.
    - name: Install the network watchdog
      ansible.builtin.copy:
        src: net-watchdog.sh
        dest: /usr/local/sbin/net-watchdog.sh
        mode: "0755"
      when: inventory_hostname in groups['cluster'] + groups['backup_raspberrypi']

    - name: Tell the network watchdog which Pis to ping
      ansible.builtin.copy:
        dest: /etc/default/net-watchdog
        content: |
          PEERS="{{ (groups['cluster'] + groups['backup_raspberrypi']) | difference([inventory_hostname]) | map('extract', hostvars, 'ansible_host') | join(' ') }}"
        mode: "0644"
      when: inventory_hostname in groups['cluster'] + groups['backup_raspberrypi']

    - name: Add the network watchdog's systemd units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: net-watchdog.service
          content: |
            [Unit]
            Description=Bounce the uplink, then reboot, when the network stays down

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/net-watchdog.sh
        - name: net-watchdog.timer
          content: |
            [Unit]
            Description=Check the network every minute

            [Timer]
            OnBootSec=2min
            OnUnitActiveSec=1min
            AccuracySec=5s

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      when: inventory_hostname in groups['cluster'] + groups['backup_raspberrypi']

    - name: Start the network watchdog
      ansible.builtin.systemd_service:
        name: net-watchdog.timer
        enabled: true
        state: started
        daemon_reload: true
      when: inventory_hostname in groups['cluster'] + groups['backup_raspberrypi']

    # The role always adds a 2:00 "update + unconditional reboot" cron. These hosts have their own
    # staggered update crons (utilities/*-maintenance.yml), so the role's cron would reboot the
    # whole cluster at once. Remove it again after every role run.
    - name: Remove the role's generic nightly update cron
      ansible.builtin.cron:
        name: "Nightly system update"
        user: root
        state: absent
      when: inventory_hostname in groups['cluster'] + groups['backup_raspberrypi']
